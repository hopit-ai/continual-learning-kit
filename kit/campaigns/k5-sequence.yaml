# GENERATED by scripts/make_k5_campaign.py: do not edit.
#
# Package K5, the headline: does the recipe hold over FOUR jobs learned one after another?
#
# A Qwen3-1.7B learns four jobs in a row with GRPO (kit/run_grpo.sh), each stage starting from the
# previous stage's MERGED checkpoint, 40 steps x 32 questions a stage. After EVERY stage all four
# held-out sets and the 300-question forgetting panel are scored, so the scorecard's (T+1) x T grid
# is filled in as the sequence runs and never reconstructed afterwards.
#
# THE JOBS
#   SQL: Spider text-to-SQL, held-out 100
#   coding: LiveCodeBench, the same held-out 51 the frontier yardstick used
#   maths: GSM8K, held-out 300
#   FinQA: annual-report arithmetic, the whole 1,147-question test split
#
# THE TWO ORDERS
#   sqlfirst    SQL -> coding -> maths -> FinQA
#   mathsfirst  maths -> FinQA -> coding -> SQL
#
# The second order is there for plan 4b: it puts maths first AND lands SQL in position 4, and SQL is
# in position 1 of the first order, so one job is measured at both ends of a sequence under the same
# seed -- the pair kit/plasticity.py compares.
#
# THE ARMS IN THIS FILE
#   `none`: plain GRPO on the current job's questions alone
#   `rehearse10`: 10 percent of every stage's rows are QUESTIONS from the jobs already
#       learned, drawn equally from each and answered afresh by the model being trained
#       (kit/mix.py), as K3 does for one earlier job
#
# Stage 1 is the same run for every arm (there is nothing yet to rehearse and nothing yet to anchor
# to), so it is trained ONCE per order and seed under the arm name `shared`, and every arm's stage 2
# starts from it. Each arm's runs live in their own {work}/arms/<order>-<arm>/runs directory, named
# <job>-pos<POSITION>-seed<SEED>, which is the name kit/plasticity.py's learning half needs.
#
# ROW ZERO IS A PILOT, and it is the whole campaign's gate: the untrained model is scored twice and
# must agree; then, at seed 0 with plain GRPO, SQL is learned (BAR 1 -- the Spider held-out count must
# RISE by at least 5) and maths is learned on top of it (BAR 2 -- the Spider count must then FALL by
# at least 5). Those are K3's two pilot bars on K3's pair of jobs, at K5's dose. The pilot is a chain
# of its own, not a prefix of either order: the headline order learns coding second, and the coding
# bed must not be able to block the gate. If bar 1 fails the model never learned the job; if bar 2
# fails nothing was lost and no protective arm could show a difference. Either way every later row
# stays REFUSED. That is the design, not a failure of the harness.
#
# All scoring is on GPU 0 of this machine, in the deterministic mode, and only scorings carrying the
# same machine-and-mode fingerprint are ever compared (receipts 204 and 209).
#
# Rows tagged `code` need kit/beds/code.py, which is being written separately. Until it exists,
# generate the three-job fallback instead: python scripts/make_k5_campaign.py --without-code
#
#   export KIT=/work/continual-learning-kit/kit WORK=/work/k5-work
#   export SDPO_DIR=/work/SDPO SPIDER_ROOT=/work/spider_data GSM8K_ROOT=/work/gsm8k
#   export FINQA_ROOT=/work/FinQA/dataset LCB_ROOT=/work/code_generation_lite CODE_TESTS is set per row
#   python $KIT/runner.py plan     $KIT/campaigns/k5-sequence.yaml
#   python $KIT/sequence.py estimate --campaign $KIT/campaigns/k5-sequence.yaml   # GPU-hours, before anything runs
#   python $KIT/runner.py prepare  $KIT/campaigns/k5-sequence.yaml --all   # no GPU: downloads, beds, pools, mixtures
#   python $KIT/runner.py run      $KIT/campaigns/k5-sequence.yaml --all   # 8 GPUs for training, GPU 0 for scoring
schema: kit-campaign.v1
name: k5-sequence
workdir_env: WORK
rows:
  # ---- THE MACHINE CHECK and STAGE 0. The untrained model is scored twice and must
  # agree: if one machine cannot score one model the same way twice, no difference this
  # campaign measures means anything (receipt 209). The first of the two IS stage 0's
  # panel scoring, so the repeat costs one extra scoring, not two. The first row carries
  # the model download and every bed's preparation, so no GPU ever waits on IO.
  # The coding bed is NOT prepared here: it is prepared by the rows tagged `code`, so that a bed which does not exist yet cannot block this gate.
  - id: base-forget-1
    pilot: true
    prepare:
      - ["bash", "-c", "test -f \"{work}/models/Qwen3-1.7B/config.json\" || hf download Qwen/Qwen3-1.7B --local-dir \"{work}/models/Qwen3-1.7B\" || huggingface-cli download Qwen/Qwen3-1.7B --local-dir \"{work}/models/Qwen3-1.7B\""]

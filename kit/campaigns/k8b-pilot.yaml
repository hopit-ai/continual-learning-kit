# GENERATED by scripts/make_pilot_campaign.py: do not edit.
#
# Plan v3, package 3: the 8B discovery pilot. Qwen3-8B, the SDPO authors' own two tasks (SciKnowEval Chemistry and
# ToolAlpaca), learned alone and one on top of the other in both orders, 40 steps a stage, under four recipes:
#
#   g8    plain GRPO as the SDPO paper tuned it: learning rate 1e-6, minibatch 8 (four optimizer steps a batch)
#   g32   plain GRPO as K1c ran it: learning rate 1e-5, minibatch 32 (the paper's "on-policy" variant)
#   sema  SDPO with the teacher moving 5 percent towards the student each step (the paper's, and K0's)
#   sfrz  SDPO with the teacher frozen at the weights each stage starts from
#
# One run of each (r1, trainer seed 42) and a second run of g8 and sema (r2, trainer seed 43), fixed in advance:
# 24 training runs. `--seeds 1` runs the first run of every recipe only.
#
# WHAT IT ASKS. When a model that learned task A is then trained on task B, how much of the score it loses on A is
# the answer no longer fitting a serving budget of 2,048 tokens, or no longer being in the form the scorer needs?
# Every checkpoint is generated once at 8,192 new tokens with its token ids kept; scores at every shorter budget are
# read from prefixes, by the task's strict rule and by a gold-blind one (kit/cap_sweep.py, kit/canonical.py), and
# kit/pilot_report.py writes acquisition, retention and their signed accounting. A task that a recipe did not
# learn cannot be said to be kept: the report marks those rows instead of scoring them.
#
# WHAT IT IS NOT. Four recipes differ in learning rate, minibatch and teacher at once: this is a discovery run that
# says where to look, not a comparison of algorithms. It is not a reproduction of any published sequence study.
#
# PILOTS FIRST (about an hour): a scoring of eight questions at the long cap; for each task, the untrained model
# generated at 8,192 and again at 2,048 new tokens in the same context, which must agree on 99 percent of answers
# (every score at a shorter budget is read from a prefix of the long generation, so nothing later means anything if
# this fails; the long generation made here is the untrained model's scoring of record); two steps of each recipe on Chemistry, which no 8B run of ours has trained on; two steps of ToolAlpaca
# started from a pilot checkpoint, which is the one new mechanism (a second stage from our own merged model); and a
# scoring of that checkpoint. Each stops everything after it if it fails. After the pilots, a training run that
# fails costs only its own scorings: every other run and the report still run.
#
# ONE PHYSICAL GPU FOR SCORING. Every scoring row carries CUDA_VISIBLE_DEVICES "0" and follows the scoring before it
# (`wants`), because the report refuses scorings whose machine fingerprints differ. If your dispatcher assigns GPUs
# itself, keep the scoring rows on one GPU. Training rows use all of them, as in K0 and K1c.
#
# ONE JOB AT A TIME ON THE NODE. Every training row takes all eight GPUs and every scoring row takes GPU 0. The
# kit's runner runs rows one after another. A dispatcher that runs rows in parallel must not start a training row
# while another training row or a scoring row is running on the same node.
#
# DISK: about 560 GB, and the first row refuses to start with less than 650 GB free under $WORK. Each run keeps its
# merged model (about 17.6 GB). The trainer's own checkpoint (about 33 GB) is deleted as soon as a complete merged
# model is on disk (KEEP_TRAINER_CKPT=0): it is only needed to resume training, which nothing here does.
#
# Trainer validation (the authors' sampled protocol, sixteen answers a question) runs at steps 0, 20 and 40 on the
# task being trained and is reported beside, never mixed with, the deterministic scorings.
#
#   export KIT=/work/continual-learning-kit/kit WORK=/work/k8b-work
#   export SDPO_DIR=/work/SDPO MODEL_DIR=/work/models/Qwen3-8B NGPU=8
#   python $KIT/runner.py batch $KIT/campaigns/k8b-pilot.yaml

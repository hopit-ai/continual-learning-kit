  # ---- FORGETTING, exactly as in K1a. One GPU, 25 minutes for the three rows below
  # plus 5 minutes a model. The untrained model is scored TWICE first: if one machine
  # cannot score one model the same way twice, no difference here means anything.
  # These three need no training and may be run early with --row.
  # ours is 251 of 300; two other machines gave 250 and 251. Far outside this band means the setup differs.
  - id: base-1
    pilot: true
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k4a/forgetting/base-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"$MODEL_DIR\" --out \"{env.OUT}\""]
    bars:
      - {name: "untrained-total", source: "{env.OUT}/forgetting.json", key: "total_correct", min: 245, max: 257}
  - id: base-2
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k4a/forgetting/base-repeat-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"$MODEL_DIR\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/forgetting.json", key: "total_correct", min: 1}
  - id: repeatable
    pilot: true
    needs: [base-1, base-2]
    env: {OUT: "{work}/k4a/repeatable-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" agree --a \"$(ls -d {work}/k4a/forgetting/base-a* | sort -V | tail -1)\" --b \"$(ls -d {work}/k4a/forgetting/base-repeat-a* | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:

    needs: [base-spider, pool1920]
    requires: ["{work}/data/spider/heldout.parquet", "{work}/models/Qwen3-1.7B/config.json"]
    env: {NAME: "budget60-r1-seed1-a{attempt}", WORK: "{work}", VAL_FILE: "{work}/data/spider/heldout.parquet", STEPS: "60", SAVE_FREQ: "60", LR: "1e-5", SEED: "1", NGPU: "8", KL: "0", FILE_LOG: "1", LENGTH_BUDGET: "800"}

  # ---- bridges (supplement S2), from lineage r1's stage-1 checkpoint, after the last prevention run has a verdict
  - id: bridges-admit
    needs: [p4-qual-tool-score]
    wants: [p4-r2-gate2, sweep-base8b-chemistry, sweep-base8b-toolalpaca, sweep-base8b-panel, sweep-g8-tool-r1-chemistry, sweep-g8-tool-r1-toolalpaca, sweep-g8-tool-r1-panel, sweep-p4-r1-ctl1-chemistry, sweep-p4-r1-ctl1-toolalpaca, sweep-p4-r1-ctl1-panel, sweep-p4-r1-ctl2-chemistry, sweep-p4-r1-ctl2-toolalpaca, sweep-p4-r1-ctl2-panel]
    order: [p4-r2-gate2, sweep-base8b-chemistry, sweep-base8b-toolalpaca, sweep-base8b-panel, sweep-g8-tool-r1-chemistry, sweep-g8-tool-r1-toolalpaca, sweep-g8-tool-r1-panel, sweep-p4-r1-ctl1-chemistry, sweep-p4-r1-ctl1-toolalpaca, sweep-p4-r1-ctl1-panel, sweep-p4-r1-ctl2-chemistry, sweep-p4-r1-ctl2-toolalpaca, sweep-p4-r1-ctl2-panel]
    env: {OUT: "{work}/k8b4/report-admit/bridges-admit-a{attempt}.json", P4_BLOCK: "bridges", P4_KIND: "cpu", P4_GPUS: "0"}
    command: ["bash", "-c", "S=\"{work}\"/k8b4/selection/selection.json && R=\"{work}\"/k8b4/budget/reservation.json && python - \"{work}\" \"$S\" \"$R\" \"{work}/k8b4/report-admit/bridges-admit-a{attempt}.json\" p4-r1-ctl1 p4-r1-ctl2 <<'PY'\nimport glob, json, os, re, sys\nwork, selection, reservation, out, controls = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5:]\ndef latest(stem, folder):\n    found = [(int(m.group(1)), p) for p in glob.glob(os.path.join(work, \"k8b4\", folder, stem + \"-a*\"))\n             for m in [re.fullmatch(re.escape(stem) + \"-a([0-9]+)\", os.path.basename(p))] if m]\n    return max(found)[1] if found else None\ndef record(key):\n    found = sorted((int(m.group(1)), p) for p in glob.glob(os.path.join(work, \"runs\", key + \"-a*\"))\n                   for m in [re.fullmatch(re.escape(key) + \"-a([0-9]+)\", os.path.basename(p))] if m)\n    for _n, p in found:\n        try:\n            s = json.load(open(os.path.join(p, \"run-summary.json\")))\n        except (OSError, ValueError):\n            continue\n        if s.get(\"merged\") == 1 and s.get(\"returncode\") == 0:\n            return p\n    return None\nmissing = []\ndef need(path, what):\n    if not path or not os.path.exists(path):\n        missing.append(\"%s (%s)\" % (what, path))\ndef scored(key):\n    for bed in (\"chemistry\", \"toolalpaca\"):\n        folder = latest(\"%s-%s\" % (key, bed), \"report-sweep\")\n        need(folder and os.path.join(folder, \"sweep.json\"), \"%s %s sweep\" % (key, bed))\n        need(folder and os.path.join(folder, \"per_item.jsonl\"), \"%s %s per-question verdicts\" % (key, bed))\n        scoring = latest(\"%s-%s\" % (key, bed), \"eval\")\n        need(scoring and os.path.join(scoring, \"bed-score.json\"), \"%s %s scoring\" % (key, bed))\n    folder = latest(\"%s-panel\" % key, \"report-sweep\")\n    need(folder and os.path.join(folder, \"sweep.json\"), \"%s panel sweep\" % key)\nsel = json.load(open(selection))\nincoming = sel[\"lineages\"][\"r1\"][\"stage1\"]\nneed(incoming.get(\"run\") and os.path.join(work, incoming[\"run\"], \"hf-step40\", \"config.json\"), \"the incoming checkpoint %s\" % incoming.get(\"key\"))\nscored(incoming[\"key\"])\nscored(\"base8b\")\nfor key in controls:\n    run = record(key)\n    need(run and os.path.join(run, \"hf-step40\", \"config.json\"), \"%s merged model of record\" % key)\n    need(run and os.path.join(run, \"env\", \"argv.txt\"), \"%s recorded command\" % key)\n    scored(key)\nbridges = json.load(open(reservation))[\"blocks\"][\"bridges\"]\nresult = {\"may_launch\": int(bridges.get(\"may_launch\") is True), \"bridges_available\": int(bridges.get(\"available\") is True),\n          \"reservation_reason\": bridges.get(\"reason\"), \"prerequisites_present\": int(not missing), \"missing\": missing,\n          \"reused_controls\": controls, \"incoming\": incoming.get(\"key\"), \"selection\": selection, \"reservation\": reservation}\nos.makedirs(os.path.dirname(out), exist_ok=True)\njson.dump(result, open(out, \"w\"), indent=1)\nprint(\"bridges: may_launch %d, prerequisites present %d%s\" % (result[\"may_launch\"], result[\"prerequisites_present\"],\n                                                             \"; missing: \" + \"; \".join(missing) if missing else \"\"))\nPY"]

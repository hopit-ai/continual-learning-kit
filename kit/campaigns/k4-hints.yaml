# GENERATED by scripts/make_k4_campaign.py: do not edit.
#
# Package K4: does a hint on the questions the model never solves teach it to answer them unaided?
#
# On a bed whose answers are checkable from the question, the untrained Qwen3-1.7B is stuck -- right in
# NONE of 8 attempts at temperature 1.0, the trainer's own sampling -- on a quarter to a third of the
# training questions, while a frontier model answers most of those from the prompt alone
# (receipt 227). So the answers ARE inferable and the model is not inferring them. This package gives
# those questions a short plan from a large open model during training, and measures the student's
# UNAIDED held-out accuracy afterwards.
#
# TWO BEDS, in this order: Spider (SQL), then FinQA (annual-report arithmetic). GSM8K is dropped: its
# stuck set is 33 questions of 640, too few for an arm to differ from its control.
#
# FIVE ARMS a bed, five seeds each, on TWO ROUTES -- a hint the STUDENT reads (GRPO, the control's own
# trainer) and a hint only the TEACHER reads (SDPO). Each route carries its own no-hint control, so
# each route's number is a difference within one trainer:
#
#   none          the GRPO route's control. NOT RUN HERE: K3 stage A (Spider) and K1c part B (FinQA)
#                 already are this arm, at the same dose from the same untrained model. Point
#                 $K3_ROOT and $K1C_ROOT at those finished packages and kit/k4_report.py reads them
#   hint          GRPO. The hint is appended to the prompt of every stuck question, for the whole run,
#                 and is absent from every measurement (kit/eval_bed.py renders prompts from the bed's
#                 own data, so nothing has to remove it)
#   hint-faded    GRPO. As `hint` for the first half of the run, then removed: two training files and
#                 a weight-initialised restart from the halfway checkpoint, exactly as K3's stage B
#                 restarts from stage A. The second file holds the rows AFTER the split, so this arm
#                 and `hint` see the same questions in the same order, each once
#   teacher-none  the SDPO route's control: kit/run_sdpo_bed.sh with FEEDBACK=0, the authors' own
#                 default, on the control's own training file. The reward function, the data, the
#                 dose and the seeds are `teacher-hint`'s; the trainer simply never puts the hint into
#                 the teacher's prompt
#   teacher-hint  SDPO, with the hint returned as the reward function's `feedback` string, which in
#                 this trainer reaches the TEACHER's prompt and nothing else. The student's training
#                 file is the control's own, unchanged
#
# SO EACH NUMBER BELONGS TO A ROUTE, and the report says which: `hint` minus `none` is the GRPO-route
# effect and is the verdict against the 3-point bar; `teacher-hint` minus `teacher-none` is the
# SDPO-route effect, one trainer key apart. `teacher-hint` minus `none` mixes the hint with the change
# of trainer and is never read as a hint effect. docs/phase2/k4/feasibility.md (d).
#
# ALL THE HINT WORK HAPPENS BEFORE ANY TRAINING GPU IS HELD. Per bed, in order: the stuck set (one
# GPU, under two minutes), the hints (your served model, no GPU of ours), the leakage filter (CPU),
# the hinted training files (CPU), and a check that the reward function loads and serves them (CPU).
# Every stage writes a small JSON the next stage reads and a bar judges.
#
# THE LEAKAGE FILTER is the reason this package can be believed. A hint is dropped if it contains the
# gold SQL query, or any complete SELECT statement, or the gold number, or any number within 1 percent
# of it, or a yes/no answer, or an `Answer:` line. Drops are counted by reason and the pilot bar is
# that at least 90 percent of the stuck set still has a hint afterwards.
#
# A FAILED PILOT STOPS EVERY LATER ROW, including the other bed's: the runner requires every earlier
# pilot before every later row, and `run --all` stops at the first refusal. That is the design, not a
# failure of the harness. Spider comes first and completely, so a FinQA pilot failure costs no Spider
# row; a Spider failure does block FinQA, and the fix is to send us the verdict and run the FinQA rows
# with --row once we have answered.
#
# All scoring is on GPU 0 of ONE machine, in the deterministic mode, and only scorings carrying the
# same machine-and-mode fingerprint are ever compared (receipts 204 and 209). The reused `none` runs
# were scored in their own packages: kit/k4_report.py REFUSES to mix two fingerprints, which is the
# one thing to watch when K3, K1c and K4 did not run in the same container on the same machine.
#
#   export KIT=/work/continual-learning-kit/kit WORK=/work/k4-work
#   export SDPO_DIR=/work/SDPO SPIDER_ROOT=/work/spider_data FINQA_ROOT=/work/FinQA/dataset
#   export HINT_BASE_URL=http://localhost:8000/v1 HINT_MODEL=Qwen/Qwen3-235B-A22B
#   export K3_ROOT=/work/k3-work/k3 K1C_ROOT=/work/k1c-work/k1c      # your finished K3 and K1c
#   python $KIT/runner.py plan    $KIT/campaigns/k4-hints.yaml
#   python $KIT/runner.py prepare $KIT/campaigns/k4-hints.yaml --all   # no GPU: data, checks, endpoint
#   python $KIT/runner.py run     $KIT/campaigns/k4-hints.yaml --all   # 8 GPUs; GPU 0 for scoring
schema: kit-campaign.v1
name: k4-hints
workdir_env: WORK
rows:
  # ---- THE UNTRAINED MODEL, and the machine check. One GPU. If one machine cannot score
  # one model the same way twice, no difference this package measures means anything
  # (receipt 209). The first of the two scorings IS the untrained panel reading, so the
  # repeat costs one extra scoring and not two. The FIRST row carries every preparation
  # step of the whole package, so all of its IO happens on a CPU before a GPU is held.
  - id: base-forget-1
    pilot: true
    prepare:
      - ["bash", "-c", "test -f \"{work}/models/Qwen3-1.7B/config.json\" || hf download Qwen/Qwen3-1.7B --local-dir \"{work}/models/Qwen3-1.7B\" || huggingface-cli download Qwen/Qwen3-1.7B --local-dir \"{work}/models/Qwen3-1.7B\""]
      - ["bash", "-c", "test -f \"{work}/data/spider/train.parquet\" || python \"{kit}/beds/spider.py\" prepare --spider-root \"$SPIDER_ROOT\" --out \"{work}/data/spider\""]
      - ["bash", "-c", "rows=$(wc -l < \"{work}/data/spider/train.jsonl\"); echo \"spider train rows: $rows (need 640)\"; test \"$rows\" -ge 640 || { echo \"the spider training file is shorter than the dose needs\" >&2; exit 2; }"]
      - ["bash", "-c", "test -f \"{work}/data/finqa-1600/train.parquet\" || python \"{kit}/beds/finqa.py\" prepare --finqa-root \"$FINQA_ROOT\" --out \"{work}/data/finqa-1600\" --limit 1600"]
      - ["bash", "-c", "rows=$(wc -l < \"{work}/data/finqa-1600/train.jsonl\"); echo \"finqa train rows: $rows (need 1600)\"; test \"$rows\" -ge 1600 || { echo \"the finqa training file is shorter than the dose needs\" >&2; exit 2; }"]
      - ["bash", "-c", "python -c 'import json,os,urllib.request;u=os.environ[\"HINT_BASE_URL\"].rstrip(\"/\")+\"/models\";print(\"hint endpoint\", u, json.dumps(json.loads(urllib.request.urlopen(u, timeout=30).read()))[:200])'"]
      - ["bash", "-c", "python \"{kit}/hints.py\" --help > /dev/null"]
      - ["bash", "-c", "test -d \"$K3_ROOT/eval\" || { echo \"set K3_ROOT to your finished K3 stage A (rows a-seed0 to a-seed4) package directory (the one holding eval/ and forgetting/): it is the `none` arm and there is no substitute\" >&2; exit 2; }"]
      - ["bash", "-c", "test -d \"$K1C_ROOT/eval\" || { echo \"set K1C_ROOT to your finished K1c part B (rows finqa-seed0 to finqa-seed4) package directory (the one holding eval/ and forgetting/): it is the `none` arm and there is no substitute\" >&2; exit 2; }"]
    requires: ["{work}/models/Qwen3-1.7B/config.json", "{work}/data/spider/train.parquet", "{work}/data/finqa-1600/train.parquet", "{kit}/hints.py"]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k4/forgetting/base-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"{work}/models/Qwen3-1.7B\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/forgetting.json", key: "total_correct", min: 1}
  - id: base-forget-2
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k4/forgetting/base-repeat-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"{work}/models/Qwen3-1.7B\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/forgetting.json", key: "total_correct", min: 1}
  - id: base-repeatable
    pilot: true
    needs: [base-forget-1, base-forget-2]
    env: {OUT: "{work}/k4/repeatable-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" agree --a \"$(ls -d {work}/k4/forgetting/base-a* | sort -V | tail -1)\" --b \"$(ls -d {work}/k4/forgetting/base-repeat-a* | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:
      - {name: "identical-answers", source: "{env.OUT}/agreement.json", key: "identical_answers", min: 295}
      - {name: "changed-verdicts", source: "{env.OUT}/agreement.json", key: "changed_verdicts", max: 0}
      - {name: "same-machine", source: "{env.OUT}/agreement.json", key: "same_machine_flag", min: 1}

  # The untrained model on each bed's held-out set. This is the design note's second
  # pilot bar (`the untrained held-out score is within the gate's band`) and it is also
  # what kit/k4_report.py splits the held-out questions by: the ones this model already
  # answers, and the ones it does not.
  # spider: text-to-SQL, executed against the question's own database; the gate found 171 of 640 training questions stuck (0 of 8 at temperature 1.0) and Opus 5 answered 85 of 120 of them from the prompt
  - id: base-spider
    pilot: true
    requires: ["{work}/models/Qwen3-1.7B/config.json", "{work}/data/spider/train.parquet", "{work}/data/spider/heldout.parquet"]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k4/eval/base-spider-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed spider --root \"$SPIDER_ROOT\" --model \"{work}/models/Qwen3-1.7B\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/bed-score.json", key: "n", min: 100, max: 100}
      - {name: "untrained-in-band", source: "{env.OUT}/bed-score.json", key: "correct", min: 55, max: 85}
  # finqa: arithmetic over a page of an annual report; the gate found 200 of 640 stuck and Opus 5 answered 62 of 120 of them. The training file is K1c's 1,600-row one, sized so that the 1.5 percent of prompts verl drops as overlong cannot shorten the dose
  - id: base-finqa
    pilot: true
    requires: ["{work}/models/Qwen3-1.7B/config.json", "{work}/data/finqa-1600/train.parquet", "{work}/data/finqa-1600/test.parquet"]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k4/eval/base-finqa-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed finqa --root \"$FINQA_ROOT\" --model \"{work}/models/Qwen3-1.7B\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/bed-score.json", key: "n", min: 1147, max: 1147}
      - {name: "untrained-in-band", source: "{env.OUT}/bed-score.json", key: "correct", min: 520, max: 760}

  # ================================================================ SPIDER: the hints
  # Four stages, each its own row so that a package that went wrong went wrong at a named
  # stage with its evidence on disk. Only the first needs a GPU, and only one.
  # 8 attempts a question at temperature 1.0 -- the trainer's own sampling, and the gate's. The band is written from the gate's measurement on the first 640 questions of this bed; outside it, this is not the model or the data the gate measured and the hints would be for the wrong questions.
  - id: spider-stuck
    pilot: true
    requires: ["{work}/data/spider/train.jsonl", "{work}/models/Qwen3-1.7B/config.json"]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k4/hints/spider-stuck-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/hints.py\" stuck --rows \"{work}/data/spider/train.jsonl\" --model \"{work}/models/Qwen3-1.7B\" --out \"{env.OUT}\""]
    bars:
      - {name: "every-question-sampled", source: "{env.OUT}/stuck.json", key: "questions", min: 640, max: 640}
      - {name: "stuck-share-in-the-gates-band", source: "{env.OUT}/stuck.json", key: "stuck_share", min: 0.2, max: 0.35}
  # your served model, asked for a three-to-five-line plan a question at a time. The request text is fixed in kit/hints.py and its sha256 is recorded here. No GPU of ours is held; the answers are committed so we can read every hint.
  - id: spider-hints
    needs: [spider-stuck]
    env: {OUT: "{work}/k4/hints/spider-asked-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/hints.py\" generate --stuck \"$(ls -d {work}/k4/hints/spider-stuck-a* | sort -V | tail -1)/stuck.json\" --rows \"{work}/data/spider/train.jsonl\" --out \"{env.OUT}\" --base-url \"$HINT_BASE_URL\" --model \"$HINT_MODEL\""]
    bars:
      - {name: "every-stuck-question-asked", source: "{env.OUT}/hints.manifest.json", key: "asked", min: 128}
      - {name: "answers-came-back", source: "{env.OUT}/hints.manifest.json", key: "with_text", min: 128}
  # THE DESIGN NOTE'S PILOT BAR 1. A hint that could contain the answer is dropped and counted by reason; at least 90 percent of the stuck set must still have one. If this fails, send us hints-dropped.jsonl and filter.json: the fix is the request text or the filter, not a lower bar.
  - id: spider-filter
    pilot: true
    needs: [spider-hints]
    env: {OUT: "{work}/k4/hints/spider-filtered-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/hints.py\" filter --hints \"$(ls -d {work}/k4/hints/spider-asked-a* | sort -V | tail -1)/hints.jsonl\" --rows \"{work}/data/spider/train.jsonl\" --stuck \"$(ls -d {work}/k4/hints/spider-stuck-a* | sort -V | tail -1)/stuck.json\" --out \"{env.OUT}\""]
    bars:
      - {name: "hint-coverage-at-least-90-percent", source: "{env.OUT}/filter.json", key: "coverage", min: 0.9}
      - {name: "hints-kept", source: "{env.OUT}/filter.json", key: "kept", min: 128}
  # writes train (hinted, for `hint`) and train-part1/train-part2 (for `hint-faded`). verl DROPS a prompt over 2,048 tokens, which would silently shorten the dose and leave no checkpoint, so the prompt lengths are counted here with the model's own tokenizer and the doses are bars.
  - id: spider-apply
    needs: [spider-filter]
    env: {OUT: "{work}/k4/hints/spider-applied-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/hints.py\" apply --rows \"{work}/data/spider/train.jsonl\" --hints \"$(ls -d {work}/k4/hints/spider-filtered-a* | sort -V | tail -1)/hints-filtered.jsonl\" --out \"{env.OUT}\" --fade-at-step 10 --steps 20 --batch 32 --tokenizer \"{work}/models/Qwen3-1.7B\" --max-prompt-tokens 2048"]
    bars:
      - {name: "rows-were-hinted", source: "{env.OUT}/apply.manifest.json", key: "hinted_rows", min: 128}
      - {name: "the-dose-still-fits", source: "{env.OUT}/apply.manifest.json", key: "rows_within_budget_after", min: 640}
      - {name: "the-faded-arms-second-half-fits", source: "{env.OUT}/apply.manifest.json", key: "part2_rows_within_budget", min: 320}
      - {name: "every-row-still-there", source: "{env.OUT}/apply.manifest.json", key: "rows", min: 640, max: 640}
      - {name: "the-hint-pushed-no-row-over-the-prompt-limit", source: "{env.OUT}/apply.manifest.json", key: "rows_pushed_over_budget", max: 32}
  # the `teacher-hint` reward function, exercised on a CPU: it must load the filtered hints, return the hint for a stuck question answered wrongly, and return an empty string for every other question. A run whose reward function served nothing would be an ordinary SDPO run reporting itself as a hint arm.
  - id: spider-hints-serve
    needs: [spider-filter]
    env: {OUT: "{work}/k4/hints/spider-serve-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/hints.py\" feedback --hints \"$(ls -d {work}/k4/hints/spider-filtered-a* | sort -V | tail -1)/hints-filtered.jsonl\" --rows \"{work}/data/spider/train.jsonl\" --out \"{env.OUT}\""]
    bars:
      - {name: "hints-load-and-serve", source: "{env.OUT}/feedback-check.json", key: "served", min: 128}
      - {name: "empty-for-every-other-question", source: "{env.OUT}/feedback-check.json", key: "empty_elsewhere", min: 1}

  # ---- SPIDER PILOTS. Two steps of each new arm, about five minutes each. Nothing below
  # runs until all four have passed. Between them they exercise every mechanism this bed
  # uses: the hinted file inside the trainer, the restart onto the plain second half, the
  # reward function that shows the teacher a hint, and the same command with the switch
  # off, which is the SDPO route's control.
  # hint: the hinted training file, read by kit/run_grpo.sh unchanged.
  - id: pilot-spider-hint
    pilot: true
    needs: [spider-apply, spider-hints-serve]
    requires: ["{work}/data/spider/heldout.parquet", "{work}/models/Qwen3-1.7B/config.json"]
    env: {NAME: "pilot-spider-hint-a{attempt}", WORK: "{work}", VAL_FILE: "{work}/data/spider/heldout.parquet", STEPS: "2", SAVE_FREQ: "2", SEED: "0", NGPU: "8", FILE_LOG: "1"}
    command: ["bash", "-c", "TRAIN_FILE=\"$(ls -d {work}/k4/hints/spider-applied-a* | sort -V | tail -1)/train.parquet\" MODEL_DIR=\"{work}/models/Qwen3-1.7B\" bash \"{kit}/run_grpo.sh\""]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/train-summary.json", key: "returncode", max: 0}
      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-run", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 2}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}
  # hint-faded: the RESTART, which is the only thing about this arm that the
  # other pilots do not cover -- two plain steps starting from the hinted
  # pilot's merged checkpoint, on the second-half file with no hints in it.
  - id: pilot-spider-hint-faded
    pilot: true
    needs: [pilot-spider-hint]
    env: {NAME: "pilot-spider-hint-faded-a{attempt}", WORK: "{work}", VAL_FILE: "{work}/data/spider/heldout.parquet", STEPS: "2", SAVE_FREQ: "2", SEED: "0", NGPU: "8", FILE_LOG: "1"}
    command: ["bash", "-c", "TRAIN_FILE=\"$(ls -d {work}/k4/hints/spider-applied-a* | sort -V | tail -1)/train-part2.parquet\" MODEL_DIR=\"$(ls -d {work}/runs/pilot-spider-hint-a*/hf-step2 | sort -V | tail -1)\" bash \"{kit}/run_grpo.sh\""]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/train-summary.json", key: "returncode", max: 0}
      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-run", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 2}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}
  # teacher-none: the SAME command with FEEDBACK=0. This is also the first
  # time SDPO has been run on one of these beds at all, so a memory or a
  # length failure belongs here and not in the grid -- and it belongs to
  # the control, which is the cheaper place to find it.
  - id: pilot-spider-teacher-none
    pilot: true
    needs: [spider-apply, spider-hints-serve]
    requires: ["{work}/data/spider/train.parquet", "{kit}/run_sdpo_bed.sh", "{kit}/hints.py"]
    env: {NAME: "pilot-spider-teacher-none-a{attempt}", WORK: "{work}", TRAIN_FILE: "{work}/data/spider/train.parquet", VAL_FILE: "{work}/data/spider/heldout.parquet", STEPS: "2", SEED: "0", NGPU: "8", SHUFFLE: "0", TASK: "datasets/spider", FEEDBACK: "0"}
    command: ["bash", "-c", "HINTS_FILE=\"$(ls -d {work}/k4/hints/spider-filtered-a* | sort -V | tail -1)/hints-filtered.jsonl\" MODEL_DIR=\"{work}/models/Qwen3-1.7B\" bash \"{kit}/run_sdpo_bed.sh\""]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/train-summary.json", key: "returncode", max: 0}
      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-run", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 2}
      - {name: "hints-were-served", source: "{work}/runs/{env.NAME}/train-summary.json", key: "hints", min: 128}
      - {name: "teacher-saw-no-feedback", source: "{work}/runs/{env.NAME}/train-summary.json", key: "feedback", max: 0}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}
  # teacher-hint: SDPO on the CONTROL'S OWN training file, with
  # kit/hints.py as the reward function and the feedback switch ON. Its
  # one difference from the pilot above is the key this arm IS.
  - id: pilot-spider-teacher-hint
    pilot: true
    needs: [spider-apply, spider-hints-serve]
    requires: ["{work}/data/spider/train.parquet", "{kit}/run_sdpo_bed.sh", "{kit}/hints.py"]
    env: {NAME: "pilot-spider-teacher-hint-a{attempt}", WORK: "{work}", TRAIN_FILE: "{work}/data/spider/train.parquet", VAL_FILE: "{work}/data/spider/heldout.parquet", STEPS: "2", SEED: "0", NGPU: "8", SHUFFLE: "0", TASK: "datasets/spider", FEEDBACK: "1"}
    command: ["bash", "-c", "HINTS_FILE=\"$(ls -d {work}/k4/hints/spider-filtered-a* | sort -V | tail -1)/hints-filtered.jsonl\" MODEL_DIR=\"{work}/models/Qwen3-1.7B\" bash \"{kit}/run_sdpo_bed.sh\""]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/train-summary.json", key: "returncode", max: 0}
      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-run", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 2}
      - {name: "hints-were-served", source: "{work}/runs/{env.NAME}/train-summary.json", key: "hints", min: 128}
      - {name: "teacher-saw-the-feedback", source: "{work}/runs/{env.NAME}/train-summary.json", key: "feedback", min: 1}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}

  # ---- SPIDER GRID. Four arms x five seeds at 20 steps x 32 questions -- the dose of
  # this bed's own control (K3 stage A (rows a-seed0 to a-seed4)), which is what makes the 3-point bar readable. The last
  # two arms are the SDPO route and differ from each other in one trainer key, so they
  # are read as a pair and not against the GRPO control.
  # Each point is then scored on the bed, unaided, and on the three general panels, on
  # GPU 0 of this machine.
  - id: spider-hint-seed0
    requires: ["{work}/data/spider/heldout.parquet", "{work}/models/Qwen3-1.7B/config.json"]
    env: {NAME: "spider-hint-seed0-a{attempt}", WORK: "{work}", VAL_FILE: "{work}/data/spider/heldout.parquet", STEPS: "20", SAVE_FREQ: "20", SEED: "0", NGPU: "8", FILE_LOG: "1"}

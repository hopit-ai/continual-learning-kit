  # ---- The readout: the eleven arms side by side, grouped by bed, each as its three runs and their
  # mean, with what the answers look like (on Spider the JOIN share, subquery share and style shift
  # against the untrained scoring; on GSM8K the format failures, answer length and truncation) and
  # each bed's rule from this file's `decision:` block. It needs the two untrained scorings and wants
  # the thirty-three run scorings (ordering only: one that failed or that --seeds skipped does not
  # block it; its bar says what it found), so a delta row below cannot keep it from being written.
  - id: report
    needs: [base-spider, base-gsm8k]
    wants: [ref20-r1-spider, ref20-r2-spider, ref20-r3-spider, kl01-r1-spider, kl01-r2-spider, kl01-r3-spider, kl10-r1-spider, kl10-r2-spider, kl10-r3-spider, ent01-r1-spider, ent01-r2-spider, ent01-r3-spider, lr06-r1-spider, lr06-r2-spider, lr06-r3-spider, lr36-r1-spider, lr36-r2-spider, lr36-r3-spider, lr06kl-r1-spider, lr06kl-r2-spider, lr06kl-r3-spider, g-ref-r1-gsm8k, g-ref-r2-gsm8k, g-ref-r3-gsm8k, g-lr06-r1-gsm8k, g-lr06-r2-gsm8k, g-lr06-r3-gsm8k, g-lr06kl-r1-gsm8k, g-lr06kl-r2-gsm8k, g-lr06kl-r3-gsm8k, g-kl01-r1-gsm8k, g-kl01-r2-gsm8k, g-kl01-r3-gsm8k]
    env: {OUT: "{work}/k3anchor/report/a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/k3_dose_report.py\" --root \"{work}/k3anchor\" --runs \"{work}/runs\" --campaign \"{kit}/campaigns/k3-anchor.yaml\" --out \"{env.OUT}\""]

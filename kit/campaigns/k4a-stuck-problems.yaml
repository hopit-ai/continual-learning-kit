# GENERATED by scripts/make_k4a_campaign.py: do not edit.
#
# Package K4a: which fix rescues SDPO's stuck questions, and at what cost to the rest?
#
# On SDPO's own tool-use task about 63 percent of every training batch has NO successful attempt
# among 8, so self-distillation has nothing to learn from there (K0, receipt 214). Three arms, each
# ONE declared change to the K0 command and nothing else, three seeds each, paired seed for seed
# with the partner's finished K0 runs dose40-seed42/43/44, which are the control. No new controls.
#
#   feedback   the authors' own switch: the TEACHER is shown the checker's mismatch message
#   soft       a partial-credit TRAINING reward; the validation score stays strictly all-or-nothing
#   variation  hotter training sampling (temperature 1.2); validation sampling is unchanged
#
# Why `variation` is temperature and not `rollout.n=16`: K0's own per-question data says doubling the
# attempts would move the share of questions with at least one success by about ONE point, because
# what the model can do it almost always does. See docs/phase2/k4a/feasibility.md (c).
#
# THE FIRST THREE ROWS ARE PILOTS and they gate everything below. Each is a two-step run of one arm
# that must exit clean, leave a merged model, land the UNTRAINED validation inside K0's calibration
# band, and keep its responses above 16 tokens.
#
# A FAILED PILOT STOPS THE WHOLE CAMPAIGN, including the other arms: the runner requires every
# earlier pilot before every later row, and `run --all` stops at the first refusal. That is the
# design, not a failure of the harness -- 60 GPU-hours of grid should not start while we still owe
# an explanation for two minutes of pilot. Send us the pilot's output.log and metrics.jsonl and we
# will drop or re-specify that arm; the rest can then be run with --row.
#
# BECAUSE one pilot stops all three arms, a bar here has to be one that cannot fail by luck. Only
# the `feedback` arm gets a bar for its own mechanism: the checker writes feedback for every failed
# attempt, so `empty_target_batch` must collapse whatever the batch holds. The other two arms move
# quantities that are noisy over two steps (K0's own per-step success share swings 0.19 to 0.62), so
# they are CHECKED IN THE REPORT, beside K0's first two steps, and gate nothing.
#
# The validation metric is K0's throughout: `val-core/tooluse/acc/mean@16`, the authors' strict
# all-or-nothing tool-use score. The `soft` arm may only ever touch training, and it does not touch
# this number at all -- the metric reads `acc`, which kit/beds/tooluse_soft.py copies from the
# authors' checker unchanged.
#
# Forgetting is scored exactly as in K1a: on GPU 0 of ONE machine, in the deterministic mode, with
# the untrained model scored twice first (cross-machine scoring drifts by up to 3 points a panel,
# the size of the floor being checked: receipt 204).
#
#   export KIT=/work/continual-learning-kit/kit WORK=/work/sdpo-work
#   export SDPO_DIR=/work/SDPO MODEL_DIR=/work/models/Qwen3-8B NGPU=8
#   export K0_REPORT=/work/k0-report/report.json          # the control: your finished K0 report
#   python $KIT/runner.py plan    $KIT/campaigns/k4a-stuck-problems.yaml
#   python $KIT/runner.py prepare $KIT/campaigns/k4a-stuck-problems.yaml --all   # no GPU: data, checks
#   python $KIT/runner.py run     $KIT/campaigns/k4a-stuck-problems.yaml --all   # 8 GPUs; GPU 0 for scoring
schema: kit-campaign.v1
name: k4a-stuck-problems
workdir_env: WORK
rows:
  # ---- THE PILOTS. Two steps of each arm, about 20 minutes each. Nothing below runs
  # until all three have passed. The first one carries every preparation step, so all
  # of this package's IO happens on a CPU before a GPU is ever held.
  # feedback: the teacher is shown the checker's mismatch message (which names the expected actions and arguments); the student's prompt and validation never see it
  # targets-now-exist: the share of the batch with nothing to learn from must COLLAPSE, and this one is safe to gate on: the checker writes feedback for every failed attempt, so it does not depend on how hard the batch was. K0's own first two steps ran 0.598-0.719 and its 154 measured steps never went below 0.383
  - id: pilot-feedback
    pilot: true
    prepare:
      - ["bash", "-c", "cd \"$SDPO_DIR\" && test -f datasets/tooluse/train.parquet -a -f datasets/tooluse/test.parquet || PYTHONPATH=\"$SDPO_DIR\" python data/preprocess.py --data_source datasets/tooluse"]
      - ["bash", "-c", "test -f \"$MODEL_DIR/config.json\" && ls \"$MODEL_DIR\"/*.safetensors > /dev/null"]
      - ["bash", "-c", "python \"{kit}/beds/tooluse_soft.py\""]
      - ["bash", "-c", "test -f \"$K0_REPORT\" || { echo \"set K0_REPORT to your finished K0 report.json\" >&2; exit 2; }"]
    requires: ["{kit}/beds/tooluse_soft.py"]
    env: {NAME: "pilot-feedback-a{attempt}", STEPS: "2", TEST_FREQ: "2", FEEDBACK: "1"}
    command: ["bash", "{kit}/run_sdpo_toolalpaca.sh"]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/run-summary.json", key: "returncode", max: 0}
      - {name: "merged-model-present", source: "{work}/runs/{env.NAME}/run-summary.json", key: "merged", min: 1}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}
      - {name: "untrained-validation", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "val-core/tooluse/acc/mean@16", where: {"step": 0}, agg: "first", min: 0.555, max: 0.6}
      - {name: "targets-now-exist", key: "self_distillation/empty_target_batch", agg: "mean", max: 0.3, source: "{work}/runs/{env.NAME}/metrics.jsonl"}
  # soft: a partial-credit TRAINING reward, so that when no attempt calls exactly the right tools with at least half the arguments right, nothing is shown to the teacher
  # CHECK, NOT A GATE -- success share: does the softer reward promote near-misses? NOT a bar -- over two steps it is noise (K0 swings 0.19 to 0.62 per step). The report prints it beside K0's own first two steps, which ran 0.281-0.406
  - id: pilot-soft
    pilot: true
    env: {NAME: "pilot-soft-a{attempt}", STEPS: "2", TEST_FREQ: "2", SOFT: "1"}
    command: ["bash", "{kit}/run_sdpo_toolalpaca.sh"]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/run-summary.json", key: "returncode", max: 0}
      - {name: "merged-model-present", source: "{work}/runs/{env.NAME}/run-summary.json", key: "merged", min: 1}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}
      - {name: "untrained-validation", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "val-core/tooluse/acc/mean@16", where: {"step": 0}, agg: "first", min: 0.555, max: 0.6}
  # variation: hotter training sampling, so the 8 attempts are 8 tries rather than 8 near-copies; validation still samples at val_kwargs.temperature=0.6, unchanged
  # CHECK, NOT A GATE -- entropy: is the policy the loss sees actually softer? NOT a bar -- two steps of it is noise. The report prints it beside K0's first two steps, which ran 0.208-0.224
  - id: pilot-variation
    pilot: true
    env: {NAME: "pilot-variation-a{attempt}", STEPS: "2", TEST_FREQ: "2", TEMP: "1.2"}
    command: ["bash", "{kit}/run_sdpo_toolalpaca.sh"]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/run-summary.json", key: "returncode", max: 0}
      - {name: "merged-model-present", source: "{work}/runs/{env.NAME}/run-summary.json", key: "merged", min: 1}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}
      - {name: "untrained-validation", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "val-core/tooluse/acc/mean@16", where: {"step": 0}, agg: "first", min: 0.555, max: 0.6}


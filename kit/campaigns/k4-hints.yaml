    bars:
      - {name: "scored", source: "{env.OUT}/forgetting.json", key: "total_correct", min: 1}

  # ================================================================ FINQA: the hints
  # Four stages, each its own row so that a package that went wrong went wrong at a named
  # stage with its evidence on disk. Only the first needs a GPU, and only one.
  # 8 attempts a question at temperature 1.0 -- the trainer's own sampling, and the gate's. The band is written from the gate's measurement on the first 640 questions of this bed; outside it, this is not the model or the data the gate measured and the hints would be for the wrong questions.
  - id: finqa-stuck
    pilot: true
    requires: ["{work}/data/finqa-1600/train.jsonl", "{work}/models/Qwen3-1.7B/config.json"]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k4/hints/finqa-stuck-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/hints.py\" stuck --rows \"{work}/data/finqa-1600/train.jsonl\" --model \"{work}/models/Qwen3-1.7B\" --out \"{env.OUT}\""]
    bars:
      - {name: "every-question-sampled", source: "{env.OUT}/stuck.json", key: "questions", min: 1600, max: 1600}
      - {name: "stuck-share-in-the-gates-band", source: "{env.OUT}/stuck.json", key: "stuck_share", min: 0.24, max: 0.39}
  # your served model, asked for a three-to-five-line plan a question at a time. The request text is fixed in kit/hints.py and its sha256 is recorded here. No GPU of ours is held; the answers are committed so we can read every hint.
  - id: finqa-hints
    needs: [finqa-stuck]
    env: {OUT: "{work}/k4/hints/finqa-asked-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/hints.py\" generate --stuck \"$(ls -d {work}/k4/hints/finqa-stuck-a* | sort -V | tail -1)/stuck.json\" --rows \"{work}/data/finqa-1600/train.jsonl\" --out \"{env.OUT}\" --base-url \"$HINT_BASE_URL\" --model \"$HINT_MODEL\""]
    bars:
      - {name: "every-stuck-question-asked", source: "{env.OUT}/hints.manifest.json", key: "asked", min: 384}
      - {name: "answers-came-back", source: "{env.OUT}/hints.manifest.json", key: "with_text", min: 384}
  # THE DESIGN NOTE'S PILOT BAR 1. A hint that could contain the answer is dropped and counted by reason; at least 90 percent of the stuck set must still have one. If this fails, send us hints-dropped.jsonl and filter.json: the fix is the request text or the filter, not a lower bar.
  - id: finqa-filter
    pilot: true
    needs: [finqa-hints]
    env: {OUT: "{work}/k4/hints/finqa-filtered-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/hints.py\" filter --hints \"$(ls -d {work}/k4/hints/finqa-asked-a* | sort -V | tail -1)/hints.jsonl\" --rows \"{work}/data/finqa-1600/train.jsonl\" --stuck \"$(ls -d {work}/k4/hints/finqa-stuck-a* | sort -V | tail -1)/stuck.json\" --out \"{env.OUT}\""]
    bars:
      - {name: "hint-coverage-at-least-90-percent", source: "{env.OUT}/filter.json", key: "coverage", min: 0.9}
      - {name: "hints-kept", source: "{env.OUT}/filter.json", key: "kept", min: 384}
  # writes train (hinted, for `hint`) and train-part1/train-part2 (for `hint-faded`). verl DROPS a prompt over 2,048 tokens, which would silently shorten the dose and leave no checkpoint, so the prompt lengths are counted here with the model's own tokenizer and the doses are bars.
  - id: finqa-apply
    needs: [finqa-filter]
    env: {OUT: "{work}/k4/hints/finqa-applied-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/hints.py\" apply --rows \"{work}/data/finqa-1600/train.jsonl\" --hints \"$(ls -d {work}/k4/hints/finqa-filtered-a* | sort -V | tail -1)/hints-filtered.jsonl\" --out \"{env.OUT}\" --fade-at-step 20 --steps 40 --batch 32 --tokenizer \"{work}/models/Qwen3-1.7B\" --max-prompt-tokens 2048"]
    bars:
      - {name: "rows-were-hinted", source: "{env.OUT}/apply.manifest.json", key: "hinted_rows", min: 384}
      - {name: "the-dose-still-fits", source: "{env.OUT}/apply.manifest.json", key: "rows_within_budget_after", min: 1280}
      - {name: "the-faded-arms-second-half-fits", source: "{env.OUT}/apply.manifest.json", key: "part2_rows_within_budget", min: 640}
      - {name: "every-row-still-there", source: "{env.OUT}/apply.manifest.json", key: "rows", min: 1600, max: 1600}
      - {name: "the-hint-pushed-no-row-over-the-prompt-limit", source: "{env.OUT}/apply.manifest.json", key: "rows_pushed_over_budget", max: 32}
  # the `teacher-hint` reward function, exercised on a CPU: it must load the filtered hints, return the hint for a stuck question answered wrongly, and return an empty string for every other question. A run whose reward function served nothing would be an ordinary SDPO run reporting itself as a hint arm.
  - id: finqa-hints-serve
    needs: [finqa-filter]
    env: {OUT: "{work}/k4/hints/finqa-serve-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/hints.py\" feedback --hints \"$(ls -d {work}/k4/hints/finqa-filtered-a* | sort -V | tail -1)/hints-filtered.jsonl\" --rows \"{work}/data/finqa-1600/train.jsonl\" --out \"{env.OUT}\""]
    bars:
      - {name: "hints-load-and-serve", source: "{env.OUT}/feedback-check.json", key: "served", min: 384}
      - {name: "empty-for-every-other-question", source: "{env.OUT}/feedback-check.json", key: "empty_elsewhere", min: 1}

  # ---- FINQA PILOTS. Two steps of each new arm, about five minutes each. Nothing below
  # runs until all four have passed. Between them they exercise every mechanism this bed
  # uses: the hinted file inside the trainer, the restart onto the plain second half, the
  # reward function that shows the teacher a hint, and the same command with the switch
  # off, which is the SDPO route's control.
  # hint: the hinted training file, read by kit/run_grpo.sh unchanged.
  - id: pilot-finqa-hint
    pilot: true
    needs: [finqa-apply, finqa-hints-serve]
    requires: ["{work}/data/finqa-1600/test.parquet", "{work}/models/Qwen3-1.7B/config.json"]
    env: {NAME: "pilot-finqa-hint-a{attempt}", WORK: "{work}", VAL_FILE: "{work}/data/finqa-1600/test.parquet", STEPS: "2", SAVE_FREQ: "2", SEED: "0", NGPU: "8", FILE_LOG: "1"}
    command: ["bash", "-c", "TRAIN_FILE=\"$(ls -d {work}/k4/hints/finqa-applied-a* | sort -V | tail -1)/train.parquet\" MODEL_DIR=\"{work}/models/Qwen3-1.7B\" bash \"{kit}/run_grpo.sh\""]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/train-summary.json", key: "returncode", max: 0}
      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-run", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 2}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}
  # hint-faded: the RESTART, which is the only thing about this arm that the
  # other pilots do not cover -- two plain steps starting from the hinted
  # pilot's merged checkpoint, on the second-half file with no hints in it.
  - id: pilot-finqa-hint-faded
    pilot: true
    needs: [pilot-finqa-hint]
    env: {NAME: "pilot-finqa-hint-faded-a{attempt}", WORK: "{work}", VAL_FILE: "{work}/data/finqa-1600/test.parquet", STEPS: "2", SAVE_FREQ: "2", SEED: "0", NGPU: "8", FILE_LOG: "1"}
    command: ["bash", "-c", "TRAIN_FILE=\"$(ls -d {work}/k4/hints/finqa-applied-a* | sort -V | tail -1)/train-part2.parquet\" MODEL_DIR=\"$(ls -d {work}/runs/pilot-finqa-hint-a*/hf-step2 | sort -V | tail -1)\" bash \"{kit}/run_grpo.sh\""]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/train-summary.json", key: "returncode", max: 0}
      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-run", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 2}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}
  # teacher-none: the SAME command with FEEDBACK=0. This is also the first
  # time SDPO has been run on one of these beds at all, so a memory or a
  # length failure belongs here and not in the grid -- and it belongs to
  # the control, which is the cheaper place to find it.
  - id: pilot-finqa-teacher-none
    pilot: true
    needs: [finqa-apply, finqa-hints-serve]
    requires: ["{work}/data/finqa-1600/train.parquet", "{kit}/run_sdpo_bed.sh", "{kit}/hints.py"]
    env: {NAME: "pilot-finqa-teacher-none-a{attempt}", WORK: "{work}", TRAIN_FILE: "{work}/data/finqa-1600/train.parquet", VAL_FILE: "{work}/data/finqa-1600/test.parquet", STEPS: "2", SEED: "0", NGPU: "8", SHUFFLE: "0", TASK: "datasets/finqa", FEEDBACK: "0"}
    command: ["bash", "-c", "HINTS_FILE=\"$(ls -d {work}/k4/hints/finqa-filtered-a* | sort -V | tail -1)/hints-filtered.jsonl\" MODEL_DIR=\"{work}/models/Qwen3-1.7B\" bash \"{kit}/run_sdpo_bed.sh\""]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/train-summary.json", key: "returncode", max: 0}
      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-run", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 2}
      - {name: "hints-were-served", source: "{work}/runs/{env.NAME}/train-summary.json", key: "hints", min: 384}
      - {name: "teacher-saw-no-feedback", source: "{work}/runs/{env.NAME}/train-summary.json", key: "feedback", max: 0}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}
  # teacher-hint: SDPO on the CONTROL'S OWN training file, with
  # kit/hints.py as the reward function and the feedback switch ON. Its
  # one difference from the pilot above is the key this arm IS.
  - id: pilot-finqa-teacher-hint
    pilot: true
    needs: [finqa-apply, finqa-hints-serve]
    requires: ["{work}/data/finqa-1600/train.parquet", "{kit}/run_sdpo_bed.sh", "{kit}/hints.py"]
    env: {NAME: "pilot-finqa-teacher-hint-a{attempt}", WORK: "{work}", TRAIN_FILE: "{work}/data/finqa-1600/train.parquet", VAL_FILE: "{work}/data/finqa-1600/test.parquet", STEPS: "2", SEED: "0", NGPU: "8", SHUFFLE: "0", TASK: "datasets/finqa", FEEDBACK: "1"}
    command: ["bash", "-c", "HINTS_FILE=\"$(ls -d {work}/k4/hints/finqa-filtered-a* | sort -V | tail -1)/hints-filtered.jsonl\" MODEL_DIR=\"{work}/models/Qwen3-1.7B\" bash \"{kit}/run_sdpo_bed.sh\""]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/train-summary.json", key: "returncode", max: 0}
      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-run", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 2}
      - {name: "hints-were-served", source: "{work}/runs/{env.NAME}/train-summary.json", key: "hints", min: 384}
      - {name: "teacher-saw-the-feedback", source: "{work}/runs/{env.NAME}/train-summary.json", key: "feedback", min: 1}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}

  # ---- FINQA GRID. Four arms x five seeds at 40 steps x 32 questions -- the dose of
  # this bed's own control (K1c part B (rows finqa-seed0 to finqa-seed4)), which is what makes the 3-point bar readable. The last
  # two arms are the SDPO route and differ from each other in one trainer key, so they
  # are read as a pair and not against the GRPO control.
  # Each point is then scored on the bed, unaided, and on the three general panels, on
  # GPU 0 of this machine.
  - id: finqa-hint-seed0
    requires: ["{work}/data/finqa-1600/test.parquet", "{work}/models/Qwen3-1.7B/config.json"]
    env: {NAME: "finqa-hint-seed0-a{attempt}", WORK: "{work}", VAL_FILE: "{work}/data/finqa-1600/test.parquet", STEPS: "40", SAVE_FREQ: "40", SEED: "0", NGPU: "8", FILE_LOG: "1"}
    command: ["bash", "-c", "TRAIN_FILE=\"$(ls -d {work}/k4/hints/finqa-applied-a* | sort -V | tail -1)/train.parquet\" MODEL_DIR=\"{work}/models/Qwen3-1.7B\" bash \"{kit}/run_grpo.sh\""]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/train-summary.json", key: "returncode", max: 0}
      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-run", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 40}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}
  - id: finqa-hint-seed0-eval
    needs: [finqa-hint-seed0]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k4/eval/finqa-hint-seed0-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed finqa --root \"$FINQA_ROOT\" --model \"$(ls -d {work}/runs/finqa-hint-seed0-a*/hf-step40 | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/bed-score.json", key: "n", min: 1147, max: 1147}
  - id: finqa-hint-seed0-forget
    needs: [finqa-hint-seed0]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k4/forgetting/finqa-hint-seed0-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"$(ls -d {work}/runs/finqa-hint-seed0-a*/hf-step40 | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/forgetting.json", key: "total_correct", min: 1}

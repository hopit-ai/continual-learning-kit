      - {name: "long-cap", source: "{work}/k1c/cap8192/eval/base17b-finqa-a{attempt}/bed-score.json", key: "max_new_tokens", min: 8192}
  - id: base17b-forget-8k
    needs: [pilot-cap]
    wants: [base17b-finqa-8k]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k1c/cap8192/forgetting/base17b-a{attempt}"}

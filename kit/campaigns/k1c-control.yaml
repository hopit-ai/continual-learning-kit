# GENERATED by scripts/make_k1c_control_campaign.py: do not edit.
#
# Plan v3, package 2: the small-model control. Qwen3-1.7B, GSM8K learned alone, 40 steps, K1c's data and command.
#
# K1c's five GSM8K runs used learning rate 1e-5 with the trainer's 8,192-token response limit, and their answers
# grew from about 250 tokens to 1,500 and more while the training reward held. Two explanations were never
# separated: the learning rate (the SDPO paper's tuned plain-RL baseline uses 1e-6) and the fact that the policy was
# trained with a limit four times the 2,048 tokens it is served at and was paid for answers the limit cut. This
# campaign runs the three cells K1c did not:
#
#   lr6        learning rate 1e-6, the response limit as in K1c (8,192), no gate
#   gate       learning rate 1e-5, training limit 2,048, reward only for an answer that finishes (FINISH_GATE)
#   lr6-gate   both changes
#
# three runs each. Every checkpoint is scored on GSM8K and the panel at 8,192 new tokens with token ids, swept to
# every shorter budget, and accounted against the untrained model scored here on the same GPU. The untrained model
# is also generated at 2,048 in the same context: its answers must agree with the long generation's prefix on 99
# percent, or no report is written. The last row applies the pre-registered rules (drift, learning, preservation,
# per run and per cell) and decides nothing by itself.
#
# ONE JOB AT A TIME ON THE NODE: training rows take all eight GPUs, scoring rows GPU 0. After the pilot, a run that
# fails costs only its own scorings; every other run and the reports still run.
#
# WHAT IT CAN SHOW. Whether the lower rate alone removes the drift; what the combined limit-and-gate change does at
# the old rate (it cannot separate the limit from the gate); how the two interact; and whether any cell learns. The
# comparison with K1c's five runs is with runs made earlier and is labelled so. It is one task: it says nothing
# about keeping a task while learning another.
#
# NEEDS the K1c tree in the same $WORK: models/Qwen3-1.7B and data/gsm8k-1280/{train,heldout}.parquet.
# About 40 to 50 GPU-hours (nine runs on eight GPUs, then scoring on GPU 0, one row after another).
#
#   export KIT=/work/continual-learning-kit/kit WORK=/work/k1c-work SDPO_DIR=/work/SDPO GSM8K_ROOT=/work/gsm8k
#   python $KIT/runner.py batch $KIT/campaigns/k1c-control.yaml
schema: kit-campaign.v1
name: k1c-control
workdir_env: WORK
rows:
  # ---- the pilot: two steps with the training limit and the gate, the two settings no run of yours has used
  - id: pilot-gate
    pilot: true
    requires: ["{work}/data/gsm8k-1280/train.parquet", "{work}/data/gsm8k-1280/heldout.parquet", "{work}/models/Qwen3-1.7B/config.json"]
    env: {NAME: "pilot-gate-a{attempt}", WORK: "{work}", TRAIN_FILE: "{work}/data/gsm8k-1280/train.parquet", VAL_FILE: "{work}/data/gsm8k-1280/heldout.parquet", STEPS: "2", SAVE_FREQ: "2", SEED: "0", NGPU: "8", FILE_LOG: "1", DUMP_ATTEMPTS: "1", LR: "1e-5", MAX_RESPONSE: "2048", FINISH_GATE: "1"}
    command: ["bash", "-c", "MODEL_DIR=\"{work}/models/Qwen3-1.7B\" bash \"{kit}/run_grpo.sh\""]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/train-summary.json", key: "returncode", max: 0}
      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-requested", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 2}

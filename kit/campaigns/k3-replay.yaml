  # ---- The readout: per arm, the mean and spread over seeds of what stage B did to job A.
  - id: report
    needs: [a-seed0-spider, a-seed0-gsm8k, a-seed1-spider, a-seed1-gsm8k, a-seed2-spider, a-seed2-gsm8k, b-none-seed0-spider, b-none-seed0-gsm8k, b-none-seed0-forget, b-none-seed1-spider, b-none-seed1-gsm8k, b-none-seed1-forget, b-none-seed2-spider, b-none-seed2-gsm8k, b-none-seed2-forget, b-rehearse10-seed0-spider, b-rehearse10-seed0-gsm8k, b-rehearse10-seed0-forget, b-rehearse10-seed1-spider, b-rehearse10-seed1-gsm8k, b-rehearse10-seed1-forget, b-rehearse10-seed2-spider, b-rehearse10-seed2-gsm8k, b-rehearse10-seed2-forget, b-rehearse30-seed0-spider, b-rehearse30-seed0-gsm8k, b-rehearse30-seed0-forget, b-rehearse30-seed1-spider, b-rehearse30-seed1-gsm8k, b-rehearse30-seed1-forget, b-rehearse30-seed2-spider, b-rehearse30-seed2-gsm8k, b-rehearse30-seed2-forget, b-kl-seed0-spider, b-kl-seed0-gsm8k, b-kl-seed0-forget, b-kl-seed1-spider, b-kl-seed1-gsm8k, b-kl-seed1-forget, b-kl-seed2-spider, b-kl-seed2-gsm8k, b-kl-seed2-forget]
    env: {OUT: "{work}/k3/report-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/k3_report.py\" --root \"{work}/k3\" --out \"{env.OUT}\""]
    bars:
      - {name: "arms-reported", source: "{env.OUT}/k3-report.json", key: "arms_reported", min: 4}
      - {name: "one-machine", source: "{env.OUT}/k3-report.json", key: "comparable", min: 1}

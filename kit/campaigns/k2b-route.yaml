# GENERATED by scripts/make_k2b_campaign.py: do not edit.
#
# Package K2b: does the route of damage decide whether an ability comes back?
#
# K2 found a model damaged by reinforcement learning got its lost ability back from a short repair (96 percent
# against the repair's own control) and a model damaged by supervised fine-tuning did not (54 percent). But the
# two were different base models, damaged by different jobs to different depths. K2b matches everything except
# the route: the untrained Qwen3-1.7B (the healthy original) learns GSM8K, 1,280 questions, 40 steps x 32,
# lr 1e-5, full parameters, either by GRPO (`rl`, kit/run_grpo.sh) or by supervised fine-tuning on the same
# questions' gold solutions (`sft`, kit/run_sft.sh). Ten repeats per route; each SFT repeat reads the same rows
# in its own order (`sft-seedN-data`), since supervised training samples nothing. After training: Spider held-out,
# GSM8K held-out and the 300-question panel. Then K2's repair, unchanged (300 LoRA steps distilling the
# original's own answers to 1,000 everyday prompts, merged and scored at 50, 100, 200 and 300 steps), on
# every trained model, and once on the untrained model itself as the control.
#
# There is no stage A: 20 GRPO steps on Spider collapse the 1.7B's SQL style instead of teaching it (receipt
# 238), so the healthy original is the untrained model and the ability at stake is what it already has.
#
# ROW ZERO IS A PILOT, and it is the whole campaign's gate. At seed 0: the untrained model is scored twice and
# must agree; each route is trained once and must LOWER Spider held-out by at least 5 against the untrained
# model. If a route does not damage Spider there is nothing to recover, and every later row stays REFUSED.
# That is an answer, not a failure of the harness. GSM8K's rise under each route is written beside it, and is
# not a gate.
#
# ONE NODE FOR EVERY SCORING. Run the whole campaign as one job on one node: training uses 8 GPUs, every
# scoring and every repair pins GPU 0 in the deterministic mode, and only scorings with one machine-and-mode
# fingerprint are compared (receipts 204 and 209).
#
#   export KIT=/work/continual-learning-kit/kit WORK=/work/k2b-work
#   export SDPO_DIR=/work/SDPO SPIDER_ROOT=/work/spider_data GSM8K_ROOT=/work/gsm8k
#   python $KIT/runner.py batch $KIT/campaigns/k2b-route.yaml       # prepare --all, then run --all
schema: kit-campaign.v1
name: k2b-route
workdir_env: WORK
rows:
  # ---- PILOT. Nothing below it runs until every pilot row has passed here.
  # The untrained model, scored twice: if one machine cannot score one model the same way twice, no
  # difference this campaign measures means anything (receipt 209). The first IS the original's panel scoring.
  - id: q17-original
    pilot: true
    prepare:
      - ["bash", "-c", "test -f \"{work}/models/Qwen3-1.7B/config.json\" || hf download Qwen/Qwen3-1.7B --local-dir \"{work}/models/Qwen3-1.7B\" || huggingface-cli download Qwen/Qwen3-1.7B --local-dir \"{work}/models/Qwen3-1.7B\""]
      - ["bash", "-c", "test -f \"{work}/data/gsm8k-1280/train.parquet\" || python \"{kit}/beds/gsm8k.py\" prepare --gsm8k-root \"$GSM8K_ROOT\" --out \"{work}/data/gsm8k-1280\" --limit 1280"]
      - ["bash", "-c", "test -f \"{work}/data/gsm8k-1280-sft/heldout.parquet\" || python \"{kit}/beds/gsm8k.py\" sft-export --from \"{work}/data/gsm8k-1280/heldout.parquet\" --gsm8k-root \"$GSM8K_ROOT\" --out \"{work}/data/gsm8k-1280-sft\""]
      - ["bash", "-c", "mkdir -p \"{work}/k2b\" && test -f \"{work}/k2b/repair-prompts.jsonl\" || python \"{kit}/repair/prompts.py\" --n 1000 --out \"{work}/k2b/repair-prompts.jsonl\""]
    requires: ["{work}/models/Qwen3-1.7B/config.json", "{work}/k2b/repair-prompts.jsonl", "{work}/data/gsm8k-1280/train.parquet", "{work}/data/gsm8k-1280/heldout.parquet", "{work}/data/gsm8k-1280-sft/heldout.parquet"]
    env: {CUDA_VISIBLE_DEVICES: "0"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"{work}/models/Qwen3-1.7B\" --out \"{work}/k2b/forgetting/q17-original-a{attempt}\""]
    bars:
      - {name: "scored", source: "{work}/k2b/forgetting/q17-original-a{attempt}/forgetting.json", key: "total_correct", min: 1}
  - id: q17-repeat
    needs: [q17-original]
    env: {CUDA_VISIBLE_DEVICES: "0"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"{work}/models/Qwen3-1.7B\" --out \"{work}/k2b/forgetting/q17-repeat-a{attempt}\""]
    bars:
      - {name: "scored", source: "{work}/k2b/forgetting/q17-repeat-a{attempt}/forgetting.json", key: "total_correct", min: 1}
  - id: q17-repeatable
    pilot: true
    needs: [q17-original, q17-repeat]
    env: {}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" agree --a \"$(ls -d {work}/k2b/forgetting/q17-original-a* | sort -V | tail -1)\" --b \"$(ls -d {work}/k2b/forgetting/q17-repeat-a* | sort -V | tail -1)\" --out \"{work}/k2b/repeatable-a{attempt}\""]
    bars:
      - {name: "identical-answers", source: "{work}/k2b/repeatable-a{attempt}/agreement.json", key: "identical_answers", min: 295}
      - {name: "changed-verdicts", source: "{work}/k2b/repeatable-a{attempt}/agreement.json", key: "changed_verdicts", max: 0}
      - {name: "same-machine", source: "{work}/k2b/repeatable-a{attempt}/agreement.json", key: "same_machine_flag", min: 1}

  # The untrained model on both jobs: the floor every later number is read against.
  - id: q17-spider
    needs: [q17-repeatable]
    env: {CUDA_VISIBLE_DEVICES: "0"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed spider --root \"$SPIDER_ROOT\" --model \"{work}/models/Qwen3-1.7B\" --out \"{work}/k2b/eval/q17-spider-a{attempt}\""]
    bars:
      - {name: "scored", source: "{work}/k2b/eval/q17-spider-a{attempt}/bed-score.json", key: "n", min: 100}
  - id: q17-gsm8k
    needs: [q17-repeatable]
    env: {CUDA_VISIBLE_DEVICES: "0"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed gsm8k --root \"$GSM8K_ROOT\" --model \"{work}/models/Qwen3-1.7B\" --out \"{work}/k2b/eval/q17-gsm8k-a{attempt}\""]
    bars:
      - {name: "scored", source: "{work}/k2b/eval/q17-gsm8k-a{attempt}/bed-score.json", key: "n", min: 300}

  # Each route at seed 0, trained and scored.
  - id: rl-seed0
    seed: 0
    pilot: true
    needs: [q17-repeatable, q17-spider, q17-gsm8k]
    requires: ["{work}/data/gsm8k-1280/train.parquet", "{work}/data/gsm8k-1280/heldout.parquet", "{work}/models/Qwen3-1.7B/config.json"]
    env: {NAME: "rl-seed0-a{attempt}", WORK: "{work}", TRAIN_FILE: "{work}/data/gsm8k-1280/train.parquet", VAL_FILE: "{work}/data/gsm8k-1280/heldout.parquet", STEPS: "40", SAVE_FREQ: "40", SEED: "0", NGPU: "8", FILE_LOG: "1"}
    command: ["bash", "-c", "MODEL_DIR=\"{work}/models/Qwen3-1.7B\" bash \"{kit}/run_grpo.sh\""]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/train-summary.json", key: "returncode", max: 0}
      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-run", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 40}
  - id: rl-seed0-spider
    seed: 0
    needs: [rl-seed0]
    env: {CUDA_VISIBLE_DEVICES: "0"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed spider --root \"$SPIDER_ROOT\" --model \"$(ls -d {work}/runs/rl-seed0-a*/hf-step40 | sort -V | tail -1)\" --out \"{work}/k2b/eval/rl-seed0-spider-a{attempt}\""]
    bars:
      - {name: "scored", source: "{work}/k2b/eval/rl-seed0-spider-a{attempt}/bed-score.json", key: "n", min: 100}
  - id: rl-seed0-gsm8k
    seed: 0
    needs: [rl-seed0]
    env: {CUDA_VISIBLE_DEVICES: "0"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed gsm8k --root \"$GSM8K_ROOT\" --model \"$(ls -d {work}/runs/rl-seed0-a*/hf-step40 | sort -V | tail -1)\" --out \"{work}/k2b/eval/rl-seed0-gsm8k-a{attempt}\""]
    bars:
      - {name: "scored", source: "{work}/k2b/eval/rl-seed0-gsm8k-a{attempt}/bed-score.json", key: "n", min: 300}
  - id: rl-seed0-before
    seed: 0
    needs: [rl-seed0]
    env: {CUDA_VISIBLE_DEVICES: "0"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"$(ls -d {work}/runs/rl-seed0-a*/hf-step40 | sort -V | tail -1)\" --out \"{work}/k2b/forgetting/rl-seed0-before-a{attempt}\""]
    bars:
      - {name: "scored", source: "{work}/k2b/forgetting/rl-seed0-before-a{attempt}/forgetting.json", key: "total_correct", min: 1}
  - id: sft-seed0-data
    seed: 0
    needs: [rl-seed0]
    requires: ["{work}/data/gsm8k-1280/train.parquet"]
    env: {}
    command: ["bash", "-c", "test -f \"{work}/data/gsm8k-1280-sft-seed0/train.manifest.json\" || python \"{kit}/beds/gsm8k.py\" sft-export --from \"{work}/data/gsm8k-1280/train.parquet\" --gsm8k-root \"$GSM8K_ROOT\" --out \"{work}/data/gsm8k-1280-sft-seed0\" --seed 0"]
    bars:
      - {name: "exported", source: "{work}/data/gsm8k-1280-sft-seed0/train.manifest.json", key: "rows", min: 1280}
      - {name: "every-target-correct", source: "{work}/data/gsm8k-1280-sft-seed0/train.manifest.json", key: "scored_correct", min: 1280}
      - {name: "its-own-order", source: "{work}/data/gsm8k-1280-sft-seed0/train.manifest.json", key: "seed", min: 0, max: 0}
  - id: sft-seed0
    seed: 0
    pilot: true
    needs: [rl-seed0, q17-spider, q17-gsm8k, sft-seed0-data]
    requires: ["{work}/data/gsm8k-1280-sft-seed0/train.parquet", "{work}/data/gsm8k-1280-sft/heldout.parquet", "{work}/models/Qwen3-1.7B/config.json"]
    env: {NAME: "sft-seed0-a{attempt}", WORK: "{work}", TRAIN_FILE: "{work}/data/gsm8k-1280-sft-seed0/train.parquet", VAL_FILE: "{work}/data/gsm8k-1280-sft/heldout.parquet", STEPS: "40", SAVE_FREQ: "40", SEED: "0", NGPU: "8", FILE_LOG: "1"}
    command: ["bash", "-c", "MODEL_DIR=\"{work}/models/Qwen3-1.7B\" bash \"{kit}/run_sft.sh\""]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/train-summary.json", key: "returncode", max: 0}
      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-run", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 40}
  - id: sft-seed0-spider
    seed: 0
    needs: [sft-seed0]
    env: {CUDA_VISIBLE_DEVICES: "0"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed spider --root \"$SPIDER_ROOT\" --model \"$(ls -d {work}/runs/sft-seed0-a*/hf-step40 | sort -V | tail -1)\" --out \"{work}/k2b/eval/sft-seed0-spider-a{attempt}\""]
    bars:
      - {name: "scored", source: "{work}/k2b/eval/sft-seed0-spider-a{attempt}/bed-score.json", key: "n", min: 100}
  - id: sft-seed0-gsm8k
    seed: 0
    needs: [sft-seed0]
    env: {CUDA_VISIBLE_DEVICES: "0"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed gsm8k --root \"$GSM8K_ROOT\" --model \"$(ls -d {work}/runs/sft-seed0-a*/hf-step40 | sort -V | tail -1)\" --out \"{work}/k2b/eval/sft-seed0-gsm8k-a{attempt}\""]
    bars:
      - {name: "scored", source: "{work}/k2b/eval/sft-seed0-gsm8k-a{attempt}/bed-score.json", key: "n", min: 300}
  - id: sft-seed0-before
    seed: 0
    needs: [sft-seed0]
    env: {CUDA_VISIBLE_DEVICES: "0"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"$(ls -d {work}/runs/sft-seed0-a*/hf-step40 | sort -V | tail -1)\" --out \"{work}/k2b/forgetting/sft-seed0-before-a{attempt}\""]
    bars:
      - {name: "scored", source: "{work}/k2b/forgetting/sft-seed0-before-a{attempt}/forgetting.json", key: "total_correct", min: 1}

  # GSM8K's rise under each route: written for the readout, not a gate (only the machine is checked).
  - id: pilot-rl-gsm8k-gain
    needs: [sft-seed0, rl-seed0-gsm8k]
    env: {}
    command: ["bash", "-c", "python \"{kit}/delta.py\" --a \"$(ls -d {work}/k2b/eval/q17-gsm8k-a* | sort -V | tail -1)\" --b \"$(ls -d {work}/k2b/eval/rl-seed0-gsm8k-a* | sort -V | tail -1)\" --key correct --out \"{work}/k2b/deltas/pilot-rl-gsm8k-gain-a{attempt}.json\""]
    bars:
      - {name: "same-machine", source: "{work}/k2b/deltas/pilot-rl-gsm8k-gain-a{attempt}.json", key: "same_machine_flag", min: 1}
  - id: pilot-sft-gsm8k-gain
    needs: [sft-seed0, sft-seed0-gsm8k]
    env: {}
    command: ["bash", "-c", "python \"{kit}/delta.py\" --a \"$(ls -d {work}/k2b/eval/q17-gsm8k-a* | sort -V | tail -1)\" --b \"$(ls -d {work}/k2b/eval/sft-seed0-gsm8k-a* | sort -V | tail -1)\" --key correct --out \"{work}/k2b/deltas/pilot-sft-gsm8k-gain-a{attempt}.json\""]
    bars:
      - {name: "same-machine", source: "{work}/k2b/deltas/pilot-sft-gsm8k-gain-a{attempt}.json", key: "same_machine_flag", min: 1}

  # THE PILOT BARS: each route must lower Spider held-out by at least 5 against the untrained model.
  - id: pilot-rl-damaged-spider
    pilot: true
    needs: [sft-seed0, rl-seed0-spider]
    env: {}
    command: ["bash", "-c", "python \"{kit}/delta.py\" --a \"$(ls -d {work}/k2b/eval/q17-spider-a* | sort -V | tail -1)\" --b \"$(ls -d {work}/k2b/eval/rl-seed0-spider-a* | sort -V | tail -1)\" --key correct --out \"{work}/k2b/deltas/pilot-rl-damaged-spider-a{attempt}.json\""]
    bars:
      - {name: "spider-fell-by-5", max: -5, source: "{work}/k2b/deltas/pilot-rl-damaged-spider-a{attempt}.json", key: "delta"}
      - {name: "same-machine", source: "{work}/k2b/deltas/pilot-rl-damaged-spider-a{attempt}.json", key: "same_machine_flag", min: 1}
  - id: pilot-sft-damaged-spider
    pilot: true
    needs: [pilot-rl-damaged-spider, sft-seed0-spider]
    env: {}
    command: ["bash", "-c", "python \"{kit}/delta.py\" --a \"$(ls -d {work}/k2b/eval/q17-spider-a* | sort -V | tail -1)\" --b \"$(ls -d {work}/k2b/eval/sft-seed0-spider-a* | sort -V | tail -1)\" --key correct --out \"{work}/k2b/deltas/pilot-sft-damaged-spider-a{attempt}.json\""]
    bars:
      - {name: "spider-fell-by-5", max: -5, source: "{work}/k2b/deltas/pilot-sft-damaged-spider-a{attempt}.json", key: "delta"}
      - {name: "same-machine", source: "{work}/k2b/deltas/pilot-sft-damaged-spider-a{attempt}.json", key: "same_machine_flag", min: 1}

  # ---- The repair's targets (the ORIGINAL's own answers) and its control, once for the whole campaign.
  - id: q17-targets
    needs: [pilot-sft-damaged-spider, q17-original]
    env: {CUDA_VISIBLE_DEVICES: "0"}
    command: ["bash", "-c", "test -f \"{work}/k2b/q17-targets.jsonl\" || python \"{kit}/repair/make_targets.py\" --model \"{work}/models/Qwen3-1.7B\" --prompts \"{work}/k2b/repair-prompts.jsonl\" --out \"{work}/k2b/q17-targets.jsonl\""]
    bars:
      - {name: "enough-targets", source: "{work}/k2b/q17-targets.jsonl.stats.json", key: "targets", min: 900}
      - {name: "few-empty", source: "{work}/k2b/q17-targets.jsonl.stats.json", key: "empty", max: 50}
  - id: q17-control300
    needs: [pilot-sft-damaged-spider, q17-targets]
    requires: ["{work}/k2b/q17-targets.jsonl"]
    env: {CUDA_VISIBLE_DEVICES: "0"}
    command: ["bash", "-c", "python \"{kit}/repair/train_lora.py\" --model \"{work}/models/Qwen3-1.7B\" --data \"{work}/k2b/q17-targets.jsonl\" --out \"{work}/k2b/repair/q17-control-run-a{attempt}\" --steps 300 --save-at 300 --lr 1e-4 && rm -rf \"{work}/k2b/tmp-q17-control300\" && python \"{kit}/repair/merge.py\" --base \"{work}/models/Qwen3-1.7B\" --adapter \"{work}/k2b/repair/q17-control-run-a{attempt}/adapter-step300\" --out \"{work}/k2b/tmp-q17-control300\" && python \"{kit}/score_forgetting.py\" generate --model \"{work}/k2b/tmp-q17-control300\" --out \"{work}/k2b/forgetting/q17-control300-a{attempt}\" && python \"{kit}/eval_bed.py\" generate --bed spider --root \"$SPIDER_ROOT\" --model \"{work}/k2b/tmp-q17-control300\" --out \"{work}/k2b/eval/q17-control300-spider-a{attempt}\"; status=$?; rm -rf \"{work}/k2b/tmp-q17-control300\"; exit $status"]
    bars:
      - {name: "scored", source: "{work}/k2b/forgetting/q17-control300-a{attempt}/forgetting.json", key: "total_correct", min: 1}
      - {name: "spider-scored", source: "{work}/k2b/eval/q17-control300-spider-a{attempt}/bed-score.json", key: "n", min: 100}

  # ---- THE GRID. Per repeat, each route: train, score, repair, score the repair. Seed 0 trained in the pilot.

  # Repeat 0.
  - id: rl-seed0-damage-check
    seed: 0
    needs: [pilot-sft-damaged-spider, rl-seed0-before]
    env: {CUDA_VISIBLE_DEVICES: "0"}
    command: ["bash", "-c", "python \"{kit}/repair/damage_check.py\" --original \"$(ls -d {work}/k2b/forgetting/q17-original-a* | sort -V | tail -1)\" --before \"$(ls -d {work}/k2b/forgetting/rl-seed0-before-a* | sort -V | tail -1)\" --out \"{work}/k2b/deltas/rl-seed0-panel-damage-a{attempt}.json\""]
    bars:
      - {name: "same-machine", source: "{work}/k2b/deltas/rl-seed0-panel-damage-a{attempt}.json", key: "same_machine_flag", min: 1}
  - id: rl-seed0-repair
    seed: 0
    needs: [pilot-sft-damaged-spider, rl-seed0-damage-check, q17-targets]
    requires: ["{work}/k2b/q17-targets.jsonl"]
    env: {CUDA_VISIBLE_DEVICES: "0"}
    command: ["bash", "-c", "python \"{kit}/repair/train_lora.py\" --model \"$(ls -d {work}/runs/rl-seed0-a*/hf-step40 | sort -V | tail -1)\" --data \"{work}/k2b/q17-targets.jsonl\" --out \"{work}/k2b/repair/rl-seed0-repair-a{attempt}\" --steps 300 --save-at 50,100,200,300 --lr 1e-4"]
    bars:
      - {name: "trained", source: "{work}/k2b/repair/rl-seed0-repair-a{attempt}/train_log.jsonl", key: "step", agg: "max", min: 300}
  - id: rl-seed0-after50
    seed: 0
    needs: [pilot-sft-damaged-spider, rl-seed0-repair]
    env: {CUDA_VISIBLE_DEVICES: "0"}
    command: ["bash", "-c", "rm -rf \"{work}/k2b/tmp-rl-seed0-after50\" \"{work}/k2b/forgetting/rl-seed0-drift-after50.json\" && python \"{kit}/repair/merge.py\" --base \"$(ls -d {work}/runs/rl-seed0-a*/hf-step40 | sort -V | tail -1)\" --adapter \"$(ls -d {work}/k2b/repair/rl-seed0-repair-a* | sort -V | tail -1)/adapter-step50\" --out \"{work}/k2b/tmp-rl-seed0-after50\" && python \"{kit}/score_forgetting.py\" generate --model \"{work}/k2b/tmp-rl-seed0-after50\" --out \"{work}/k2b/forgetting/rl-seed0-after50-a{attempt}\" && python \"{kit}/eval_bed.py\" generate --bed spider --root \"$SPIDER_ROOT\" --model \"{work}/k2b/tmp-rl-seed0-after50\" --out \"{work}/k2b/eval/rl-seed0-after50-spider-a{attempt}\" && python \"{kit}/repair/drift.py\" --reference \"{work}/models/Qwen3-1.7B\" --model \"{work}/k2b/tmp-rl-seed0-after50\" --out \"{work}/k2b/forgetting/rl-seed0-drift-after50.json\"; status=$?; rm -rf \"{work}/k2b/tmp-rl-seed0-after50\"; exit $status"]
    bars:
      - {name: "scored", source: "{work}/k2b/forgetting/rl-seed0-after50-a{attempt}/forgetting.json", key: "total_correct", min: 1}
      - {name: "spider-scored", source: "{work}/k2b/eval/rl-seed0-after50-spider-a{attempt}/bed-score.json", key: "n", min: 100}
  - id: rl-seed0-after100
    seed: 0

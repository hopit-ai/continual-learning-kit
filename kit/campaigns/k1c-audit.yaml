    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed gsm8k --root \"$GSM8K_ROOT\" --model \"{work}/models/Qwen3-1.7B\" --max-new-tokens 8192 --max-model-len 12288 --limit 8 --out \"{work}/k1c/cap8192/pilot-a{attempt}\""]

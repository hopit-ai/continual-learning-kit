  # ---- The readout: per arm, the mean and spread over seeds of what stage B did to job A.
  # Report rows NEED only the pilots and the untrained (base) scorings; every per-seed row they read is
  # in `wants`: it runs first when it is scheduled, and one that failed or that `--seeds` skipped does
  # not block the report, whose bars and readout say what it found.

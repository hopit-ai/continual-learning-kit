  - id: budget-gsm8k
    needs: [pilot-cap, sweep-base17b-gsm8k]
    wants: [sweep-gsm8k-seed0-gsm8k, sweep-gsm8k-seed1-gsm8k, sweep-gsm8k-seed2-gsm8k, sweep-gsm8k-seed3-gsm8k, sweep-gsm8k-seed4-gsm8k, check-same-gpu-gsm8k-seed0]
    env: {OUT: "{work}/k1c/cap8192/report-budget-gsm8k-a{attempt}"}
    command: ["bash", "-c", "AFTER=(); QUAL=(); for s in 0 1 2 3 4; do d=$(ls -d \"{work}/k1c/cap8192\"/report-sweep/gsm8k-seed$s-gsm8k-a* 2>/dev/null | sort -V | tail -1); if [ -n \"$d\" ] && [ -f \"$d/sweep.json\" ]; then AFTER+=(--after \"seed$s=$d\"); case \" 0 \" in *\" $s \"*) c=$(ls \"{work}/k1c/cap8192\"/report-prefix/same-gpu-gsm8k-seed$s-gsm8k-a*.json 2>/dev/null | sort -V | tail -1); QUAL+=(--qualify \"seed$s=${c:-{work}/k1c/cap8192/report-prefix/same-gpu-gsm8k-seed$s-gsm8k-a1.json}\");; esac; fi; done; python \"{kit}/budget_report.py\" --ref \"$(ls -d \"{work}/k1c/cap8192\"/report-sweep/base17b-gsm8k-a* | sort -V | tail -1)\" \"${AFTER[@]}\" \"${QUAL[@]}\" --serving 2048 --diagnostic 8192 --seeds-label \"gsm8k learned alone, 40 steps, K1c Part B\" --out \"{work}/k1c/cap8192/report-budget-gsm8k-a{attempt}\""]
    bars:
      - {name: "seeds-reported", source: "{work}/k1c/cap8192/report-budget-gsm8k-a{attempt}/budget-report.json", key: "scorings_reported", min: 1}
      - {name: "accounting-exact", source: "{work}/k1c/cap8192/report-budget-gsm8k-a{attempt}/budget-report.json", key: "accounting_exact", min: 1}
  - id: budget-finqa
    needs: [pilot-cap, sweep-base17b-finqa]
    wants: [sweep-finqa-seed0-finqa, sweep-finqa-seed1-finqa, sweep-finqa-seed2-finqa, sweep-finqa-seed3-finqa, sweep-finqa-seed4-finqa, check-same-gpu-finqa-seed1]
    env: {OUT: "{work}/k1c/cap8192/report-budget-finqa-a{attempt}"}

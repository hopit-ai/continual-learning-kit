# GENERATED by scripts/make_k3_campaign.py: do not edit.
#
# Package K3: does rehearsing the old job's questions protect it while a new job is learned?
#
# A Qwen3-1.7B learns SQL (Spider, 640 questions, GRPO), then learns maths (GSM8K, GRPO) starting
# from the SQL model. Four stage-B arms: `none` (maths only), `rehearse10` and `rehearse30` (10 or 30
# percent of the stage-B rows are Spider QUESTIONS, answered afresh by the model being trained and
# rewarded by Spider's own checker, so the rehearsal is fully on-policy), and `kl` (maths only, with
# the trainer's KL-to-reference loss on). Three seeds each.
#
# Stage B is a WEIGHT-INITIALISED RESTART from stage A's merged checkpoint: fresh optimizer state,
# fresh warm-up, no resume. That is true for every arm, so the arms differ only in their data and
# their loss.
#
# ROW ZERO IS A PILOT, and it is the whole campaign's gate. At seed 0, in order: the untrained model
# is scored twice and must agree; stage A is trained; BAR 1 -- Spider held-out correct must RISE by at
# least 5; stage B arm `none` is trained; BAR 2 -- Spider held-out correct must then FALL by at least 5.
# If bar 1 fails the model never learned the job; if bar 2 fails there is nothing to protect, and a
# rehearsal arm could only show a difference by noise. Either way every later row stays REFUSED. That
# is the design, not a failure of the harness.
#
# All scoring is on GPU 0 of this machine, in the deterministic mode, and only scorings carrying the
# same machine-and-mode fingerprint are ever compared (receipts 204 and 209).
#
#   export KIT=/work/continual-learning-kit/kit WORK=/work/k3-work
#   export SDPO_DIR=/work/SDPO SPIDER_ROOT=/work/spider_data GSM8K_ROOT=/work/gsm8k
#   python $KIT/runner.py plan    $KIT/campaigns/k3-replay.yaml
#   python $KIT/runner.py prepare $KIT/campaigns/k3-replay.yaml --all     # no GPU: downloads, bed files, mixtures
#   python $KIT/runner.py run     $KIT/campaigns/k3-replay.yaml --all     # 8 GPUs for training, GPU 0 for scoring
schema: kit-campaign.v1
name: k3-replay

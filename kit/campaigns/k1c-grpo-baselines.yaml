  # ---- The readout: both parts, every arm and seed, beside the K0 SDPO runs and (when
  # K3_REPORT is set) K3's SQL-alone rows. Every run and every scoring it reads is named
  # here, so the report cannot be written over a hole.
  - id: report
    needs: [full-seed42, full-seed43, full-seed44, full-seed45, full-seed46, lora-seed42, lora-seed43, lora-seed44, lora-seed45, lora-seed46, full-seed42-forget, full-seed43-forget, full-seed44-forget, full-seed45-forget, full-seed46-forget, lora-seed42-forget, lora-seed43-forget, lora-seed44-forget, lora-seed45-forget, lora-seed46-forget, base17b-finqa, base17b-gsm8k, base17b-forget, finqa-seed0, finqa-seed1, finqa-seed2, finqa-seed3, finqa-seed4, finqa-seed0-finqa, finqa-seed1-finqa, finqa-seed2-finqa, finqa-seed3-finqa, finqa-seed4-finqa, finqa-seed0-forget, finqa-seed1-forget, finqa-seed2-forget, finqa-seed3-forget, finqa-seed4-forget, gsm8k-seed0, gsm8k-seed1, gsm8k-seed2, gsm8k-seed3, gsm8k-seed4, gsm8k-seed0-gsm8k, gsm8k-seed1-gsm8k, gsm8k-seed2-gsm8k, gsm8k-seed3-gsm8k, gsm8k-seed4-gsm8k, gsm8k-seed0-forget, gsm8k-seed1-forget, gsm8k-seed2-forget, gsm8k-seed3-forget, gsm8k-seed4-forget]
    env: {OUT: "{work}/k1c/report-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/k1c_report.py\" --runs \"{work}/runs\" --forgetting \"{work}/k1c/forgetting\" --eval \"{work}/k1c/eval\" --k0 \"$K0_REPORT\" ${K3_REPORT:+--k3 \"$K3_REPORT\"} --out \"{env.OUT}\""]
    bars:
      - {name: "both-parts-reported", source: "{env.OUT}/k1c-report.json", key: "parts_reported", min: 2}
      - {name: "arms-reported", source: "{env.OUT}/k1c-report.json", key: "arms_reported", min: 4}
      - {name: "sdpo-comparator-found", source: "{env.OUT}/k1c-report.json", key: "comparator_runs", min: 5}
      - {name: "one-machine", source: "{env.OUT}/k1c-report.json", key: "comparable", min: 1}

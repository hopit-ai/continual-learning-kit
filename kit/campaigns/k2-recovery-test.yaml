# GENERATED by scripts/make_k2_campaign.py: do not edit.
#
# Package K2: the recovery test. Is a damaged model's lost ability still inside it?
#
# For each damaged model: score it, train a small adapter for 300 steps on the ORIGINAL model's own answers
# to 1,000 everyday prompts (no maths, no exam questions, no formatting rules), and score again at steps
# 50, 100, 200 and 300. If the ability comes back, it was never lost, only hidden behind a bad answering
# habit. A control applies the same repair to the healthy original, to show the repair is not itself harmful.
#
# ROW ZERO IS A PILOT on a 0.6B model that the campaign damages on purpose. Every 8B row is refused until
# the pilot has passed on your machine. One GPU throughout (scores are only comparable on one GPU).
#
#   export KIT=/work/continual-learning-kit/kit WORK=/work/k2-work
#   python $KIT/runner.py plan    $KIT/campaigns/k2-recovery-test.yaml
#   python $KIT/runner.py prepare $KIT/campaigns/k2-recovery-test.yaml --all     # no GPU: downloads and prompt files
#   python $KIT/runner.py run     $KIT/campaigns/k2-recovery-test.yaml --all     # one GPU, about 4 to 6 hours

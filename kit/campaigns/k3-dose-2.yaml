  # ---- The readout: the four arms side by side, each as its three runs and their mean, every dose
  # and budget read from the run's own train-summary.json, the arms, runs and descriptions from this
  # file. It needs the thirteen scorings and nothing else, so a delta row below cannot keep it from
  # being written.
  - id: report
    needs: [base-spider, budget20-r1-spider, budget20-r2-spider, budget20-r3-spider, budget40-r1-spider, budget40-r2-spider, budget40-r3-spider, budget60-r1-spider, budget60-r2-spider, budget60-r3-spider, ref20-r1-spider, ref20-r2-spider, ref20-r3-spider]
    env: {OUT: "{work}/k3dose2/report/a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/k3_dose_report.py\" --root \"{work}/k3dose2\" --runs \"{work}/runs\" --campaign \"{kit}/campaigns/k3-dose-2.yaml\" --out \"{env.OUT}\""]
    bars:
      - {name: "arms-reported", source: "{env.OUT}/report.json", key: "arms_reported", min: 4}

  # ---- THE READOUTS, one per run, and nothing needs them. A FAILED BAR HERE IS AN ANSWER, not a
  # broken probe.
  - id: budget20-r1-delta
    needs: [base-spider, budget20-r1-spider]
    env: {OUT: "{work}/k3dose2/deltas/budget20-r1-a{attempt}.json"}
    command: ["bash", "-c", "python \"{kit}/delta.py\" --a \"$(ls -d {work}/k3dose2/eval/base-spider-a* | sort -V | tail -1)\" --b \"$(ls -d {work}/k3dose2/eval/budget20-r1-spider-a* | sort -V | tail -1)\" --key correct --out \"{env.OUT}\""]
    bars:
      - {name: "delta-recorded", source: "{env.OUT}", key: "delta", min: -100}   # the verdict is the report's; a failing run must not halt `run --all`
      - {name: "same-machine", source: "{env.OUT}", key: "same_machine_flag", min: 1}
  - id: budget20-r2-delta

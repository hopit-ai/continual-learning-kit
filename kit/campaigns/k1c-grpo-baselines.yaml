      - {name: "arm-is-lora", source: "{work}/runs/{env.NAME}/run-summary.json", key: "lora", min: 1}
      - {name: "adapter-folded", source: "{work}/runs/{env.NAME}/run-summary.json", key: "folded", min: 1}
      - {name: "weights-really-changed", source: "{work}/runs/{env.NAME}/run-summary.json", key: "fold_changed_tensors", min: 1}
      - {name: "untrained-validation", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "val-core/tooluse/acc/mean@16", where: {"step": 0}, agg: "first", min: 0.555, max: 0.6}


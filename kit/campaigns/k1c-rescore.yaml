# K1c rescoring at the trainer's own answer cap. Hand-written; one purpose.
#
# K1c Part B scored every trained 1.7B at the kit's 2,048-new-token cap, the same cap the untrained
# model and every panel use. The archive showed those models' answers had grown to 1,500 to 8,000
# tokens during training, where the trainer allowed 8,192: in the eight of ten Part B scorings that collapsed the answers cut at
# the cap account for the "wrong format" count almost one for one, and most answers that finished were
# right (receipt 241). So the 2,048 count cannot tell lost arithmetic from an answer that ran past the
# cap. This campaign scores the SAME ten Part B checkpoints and the untrained model again at 8,192
# new tokens, bed and panel, on one GPU each, and writes a second K1c report from those scorings.
#
# WHAT IT IS NOT. The bar of record stays the 2,048-token scoring (K1c's report-a1): a model that needs
# four times the tokens to finish has still failed the cost bar (1.5x tokens per correct answer). This
# is a diagnosis -- is the ability intact behind the drift? -- and the report it writes says so.
#
# NEEDS: the finished K1c tree in the same $WORK (runs/*/hf-step40 for the ten Part B runs and
# models/Qwen3-1.7B). Nothing here trains. About 3 to 6 GPU-hours in all on one GPU per row; rows carry
# CUDA_VISIBLE_DEVICES 0 to 7 so a parallel dispatcher spreads them, and every row is independent.
#
#   export KIT=/work/continual-learning-kit/kit WORK=/work/k1c-work
#   export GSM8K_ROOT=/work/gsm8k FINQA_ROOT=/work/FinQA/dataset K0_REPORT=/work/k0-report/report.json
#   python $KIT/runner.py batch $KIT/campaigns/k1c-rescore.yaml
schema: kit-campaign.v1
name: k1c-rescore
workdir_env: WORK
rows:
  # ---- the untrained model at the long cap: the row every trained one is read against
  - id: base17b-gsm8k-8k
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k1c/eval8k/base17b-gsm8k-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed gsm8k --root \"$GSM8K_ROOT\" --model \"{work}/models/Qwen3-1.7B\" --max-new-tokens 8192 --out \"{work}/k1c/eval8k/base17b-gsm8k-a{attempt}\""]
    bars:
      - {name: "scored", source: "{work}/k1c/eval8k/base17b-gsm8k-a{attempt}/bed-score.json", key: "n", min: 300}
      - {name: "long-cap", source: "{work}/k1c/eval8k/base17b-gsm8k-a{attempt}/bed-score.json", key: "max_new_tokens", min: 8192}
  - id: base17b-finqa-8k
    env: {CUDA_VISIBLE_DEVICES: "1", OUT: "{work}/k1c/eval8k/base17b-finqa-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed finqa --root \"$FINQA_ROOT\" --model \"{work}/models/Qwen3-1.7B\" --max-new-tokens 8192 --out \"{work}/k1c/eval8k/base17b-finqa-a{attempt}\""]
    bars:
      - {name: "scored", source: "{work}/k1c/eval8k/base17b-finqa-a{attempt}/bed-score.json", key: "n", min: 1147}
      - {name: "long-cap", source: "{work}/k1c/eval8k/base17b-finqa-a{attempt}/bed-score.json", key: "max_new_tokens", min: 8192}
  - id: base17b-forget-8k
    env: {CUDA_VISIBLE_DEVICES: "2", OUT: "{work}/k1c/forgetting8k/base17b-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"{work}/models/Qwen3-1.7B\" --max-new-tokens 8192 --out \"{work}/k1c/forgetting8k/base17b-a{attempt}\""]
    bars:
      - {name: "scored", source: "{work}/k1c/forgetting8k/base17b-a{attempt}/forgetting.json", key: "total_correct", min: 1}
      - {name: "long-cap", source: "{work}/k1c/forgetting8k/base17b-a{attempt}/forgetting.json", key: "max_new_tokens", min: 8192}

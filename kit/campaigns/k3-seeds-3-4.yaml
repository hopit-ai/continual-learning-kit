# GENERATED by scripts/make_seeds_followup.py: do not edit.
#
# K3 seeds 3 and 4: the two seeds that take package K3 from three to five.
#
# kit/campaigns/k3-replay.yaml ran seeds 0, 1 and 2. A comparison needs at least five seeds: K0
# showed a 3 to 4 point spread between seeds of one method, and K3's whole readout is a difference
# of counts between arms. This campaign is the same stage A and the same four stage-B arms at seeds
# 3 and 4, and NOTHING else.
#
# IT RUNS IN THE SAME WORK DIRECTORY AS K3, with K3's names for every run and every folder:
# $WORK/runs/a-seed3-a1, $WORK/k3/eval/b-kl-seed4-spider-a1, and so on. That is what lets
# kit/k3_report.py read all five seeds without being changed: point it at the same $WORK/k3 and the
# new seeds appear in the same tables as the old ones.
#
# THE ONLY PILOT IS A LOOK AT K3'S OWN. No pilot is repeated and no new pilot is trained: the first
# row reads the verdicts of K3's five pilots from $WORK/campaign/k3-replay/ and refuses everything
# below unless all five passed in this same work directory.
#
# Run it in the same container, on the same machine, as K3 itself: every count here is compared with
# a count from that run, and across machines a panel moves by up to 3 points before any training
# (receipts 204 and 209). The report refuses to mix two machines.
#
#   export KIT=/work/continual-learning-kit/kit WORK=/work/k3-work
#   export SDPO_DIR=/work/SDPO SPIDER_ROOT=/work/spider_data GSM8K_ROOT=/work/gsm8k
#   python $KIT/runner.py plan    $KIT/campaigns/k3-seeds-3-4.yaml
#   python $KIT/runner.py prepare $KIT/campaigns/k3-seeds-3-4.yaml --all   # no GPU: the four new mixtures
#   python $KIT/runner.py run     $KIT/campaigns/k3-seeds-3-4.yaml --all   # 8 GPUs for training, GPU 0 for scoring
schema: kit-campaign.v1
name: k3-seeds-3-4
workdir_env: WORK
rows:
  # ---- THE ONLY CONDITION, and the whole of this campaign's pilot. This row trains nothing
  # and scores nothing: it reads the verdicts the runner already wrote in THIS work directory
  # for the 5 pilots of k3-replay, and its bars require every one of them to have
  # passed. A follow-up may not repeat a pilot and may not invent one of its own -- if the
  # original never ran here, or one of its pilots failed, there is nothing to add seeds to and
  # every row below stays REFUSED.
  - id: original-pilots-passed
    pilot: true
    env: {OUT: "{work}/k3/pilots-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/pilots_passed.py\" --campaign \"{kit}/campaigns/k3-replay.yaml\" --out \"{env.OUT}\""]
    bars:
      - {name: "every-pilot-passed", source: "{env.OUT}/pilots-passed.json", key: "passed_count", min: 5, max: 5}
      - {name: "pilots-still-5", source: "{env.OUT}/pilots-passed.json", key: "expected_count", min: 5, max: 5}

  # ---- Stage A, once per new seed: the same 20 steps over Spider's 640 questions.
  - id: a-seed3
    requires: ["{work}/data/spider/train.parquet", "{work}/models/Qwen3-1.7B/config.json"]
    env: {NAME: "a-seed3-a{attempt}", WORK: "{work}", TRAIN_FILE: "{work}/data/spider/train.parquet", VAL_FILE: "{work}/data/spider/heldout.parquet", STEPS: "20", SAVE_FREQ: "20", SEED: "3", NGPU: "8", KL: "0"}
    command: ["bash", "-c", "MODEL_DIR=\"{work}/models/Qwen3-1.7B\" bash \"{kit}/run_grpo.sh\""]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/train-summary.json", key: "returncode", max: 0}
      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-run", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 20}
  - id: a-seed3-spider
    needs: [a-seed3]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k3/eval/a-seed3-spider-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed spider --root \"$SPIDER_ROOT\" --model \"$(ls -d {work}/runs/a-seed3-a*/hf-step20 | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/bed-score.json", key: "n", min: 100}
  - id: a-seed3-gsm8k
    needs: [a-seed3]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k3/eval/a-seed3-gsm8k-a{attempt}"}

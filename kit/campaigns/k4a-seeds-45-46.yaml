# GENERATED by scripts/make_seeds_followup.py: do not edit.
#
# K4a seeds 45 and 46: the two seeds that take package K4a from three to five.
#
# kit/campaigns/k4a-stuck-problems.yaml ran the three arms at seeds 42, 43 and 44. A comparison
# needs at least five seeds: K0 showed a 3 to 4 point spread between seeds of one method. This
# campaign is the same three arms, the same K0 dose and the same bars at seeds 45 and 46, and
# NOTHING else -- no new pilot, no new control, no changed setting.
#
# IT RUNS IN THE SAME WORK DIRECTORY AS K4a, with K4a's names for every run and every folder:
# $WORK/runs/feedback-seed45-a1, $WORK/k4a/forgetting/soft-seed46-a1, and so on. That is what lets
# kit/k4a_report.py read all five seeds without being changed, including the untrained panel
# scoring K4a already wrote at $WORK/k4a/forgetting/base-a1, which these panels are read against.
#
# THE ONLY PILOT IS A LOOK AT K4a'S OWN. The first row reads the verdicts of K4a's five pilots from
# $WORK/campaign/k4a-stuck-problems/ and refuses everything below unless all five passed in this
# same work directory -- which includes `base-1` and `repeatable`, the untrained panel scoring and
# its repeat that every panel count below is compared against.
#
# ONE THING THESE TWO SEEDS CANNOT BUY. Every K4a arm is paired seed for seed with a finished K0
# run, and K0 ran dose40-seed42, 43 and 44 only. Seeds 45 and 46 have no K0 twin, so they widen the
# spread of each arm's OWN score to five seeds, while the paired arm-minus-control difference stays
# a comparison over three. The report prints both, and leaves the control column empty for these
# two seeds rather than filling it with someone else's number.
#
# Run it in the same container, on the same machine, as K4a itself: the panel counts are compared
# with counts from that run, and across machines a panel moves by up to 3 points before any
# training (receipt 204). The report refuses to mix two machines.
#
#   export KIT=/work/continual-learning-kit/kit WORK=/work/sdpo-work
#   export SDPO_DIR=/work/SDPO MODEL_DIR=/work/models/Qwen3-8B NGPU=8
#   export K0_REPORT=/work/k0-report/report.json          # the control: your finished K0 report
#   python $KIT/runner.py plan    $KIT/campaigns/k4a-seeds-45-46.yaml
#   python $KIT/runner.py prepare $KIT/campaigns/k4a-seeds-45-46.yaml --all
#   python $KIT/runner.py run     $KIT/campaigns/k4a-seeds-45-46.yaml --all   # 8 GPUs; GPU 0 for scoring
schema: kit-campaign.v1
name: k4a-seeds-45-46
workdir_env: WORK
rows:
  # ---- THE ONLY CONDITION, and the whole of this campaign's pilot. This row trains nothing
  # and scores nothing: it reads the verdicts the runner already wrote in THIS work directory
  # for the 5 pilots of k4a-stuck-problems, and its bars require every one of them to have
  # passed. A follow-up may not repeat a pilot and may not invent one of its own -- if the
  # original never ran here, or one of its pilots failed, there is nothing to add seeds to and
  # every row below stays REFUSED.
  - id: original-pilots-passed
    pilot: true
    env: {OUT: "{work}/k4a/pilots-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/pilots_passed.py\" --campaign \"{kit}/campaigns/k4a-stuck-problems.yaml\" --out \"{env.OUT}\""]
    bars:
      - {name: "every-pilot-passed", source: "{env.OUT}/pilots-passed.json", key: "passed_count", min: 5, max: 5}
      - {name: "pilots-still-5", source: "{env.OUT}/pilots-passed.json", key: "expected_count", min: 5, max: 5}

  # ---- THE GRID, at K0's dose exactly as the three published seeds ran it: 40 steps,
  # validation every 5, batch 32, 8 attempts, warm-up 10. About 50 minutes each on 8 x H100.
  - id: feedback-seed45
    env: {NAME: "feedback-seed45-a{attempt}", STEPS: "40", TEST_FREQ: "5", SEED: "45", FEEDBACK: "1"}
    command: ["bash", "{kit}/run_sdpo_toolalpaca.sh"]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/run-summary.json", key: "returncode", max: 0}
      - {name: "merged-model-present", source: "{work}/runs/{env.NAME}/run-summary.json", key: "merged", min: 1}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}
      - {name: "final-validation", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "val-core/tooluse/acc/mean@16", where: {"step": 40}, agg: "last", min: 0.0}
  - id: feedback-seed46
    env: {NAME: "feedback-seed46-a{attempt}", STEPS: "40", TEST_FREQ: "5", SEED: "46", FEEDBACK: "1"}
    command: ["bash", "{kit}/run_sdpo_toolalpaca.sh"]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/run-summary.json", key: "returncode", max: 0}
      - {name: "merged-model-present", source: "{work}/runs/{env.NAME}/run-summary.json", key: "merged", min: 1}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}
      - {name: "final-validation", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "val-core/tooluse/acc/mean@16", where: {"step": 40}, agg: "last", min: 0.0}
  - id: soft-seed45
    env: {NAME: "soft-seed45-a{attempt}", STEPS: "40", TEST_FREQ: "5", SEED: "45", SOFT: "1"}
    command: ["bash", "{kit}/run_sdpo_toolalpaca.sh"]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/run-summary.json", key: "returncode", max: 0}
      - {name: "merged-model-present", source: "{work}/runs/{env.NAME}/run-summary.json", key: "merged", min: 1}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}
      - {name: "final-validation", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "val-core/tooluse/acc/mean@16", where: {"step": 40}, agg: "last", min: 0.0}
  - id: soft-seed46
    env: {NAME: "soft-seed46-a{attempt}", STEPS: "40", TEST_FREQ: "5", SEED: "46", SOFT: "1"}
    command: ["bash", "{kit}/run_sdpo_toolalpaca.sh"]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/run-summary.json", key: "returncode", max: 0}
      - {name: "merged-model-present", source: "{work}/runs/{env.NAME}/run-summary.json", key: "merged", min: 1}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}
      - {name: "final-validation", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "val-core/tooluse/acc/mean@16", where: {"step": 40}, agg: "last", min: 0.0}
  - id: variation-seed45
    env: {NAME: "variation-seed45-a{attempt}", STEPS: "40", TEST_FREQ: "5", SEED: "45", TEMP: "1.2"}
    command: ["bash", "{kit}/run_sdpo_toolalpaca.sh"]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/run-summary.json", key: "returncode", max: 0}
      - {name: "merged-model-present", source: "{work}/runs/{env.NAME}/run-summary.json", key: "merged", min: 1}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}
      - {name: "final-validation", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "val-core/tooluse/acc/mean@16", where: {"step": 40}, agg: "last", min: 0.0}
  - id: variation-seed46
    env: {NAME: "variation-seed46-a{attempt}", STEPS: "40", TEST_FREQ: "5", SEED: "46", TEMP: "1.2"}
    command: ["bash", "{kit}/run_sdpo_toolalpaca.sh"]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/run-summary.json", key: "returncode", max: 0}
      - {name: "merged-model-present", source: "{work}/runs/{env.NAME}/run-summary.json", key: "merged", min: 1}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}
      - {name: "final-validation", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "val-core/tooluse/acc/mean@16", where: {"step": 40}, agg: "last", min: 0.0}

  # ---- FORGETTING, on GPU 0 of the machine that scored K4a's untrained model. The
  # untrained scoring and its repeat are not done again: they are in this WORK already,
  # and the gate row above is what checks they passed.
  - id: feedback-seed45-forget
    needs: [feedback-seed45]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k4a/forgetting/feedback-seed45-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"$(ls -d {work}/runs/feedback-seed45-a*/hf-step40 | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/forgetting.json", key: "total_correct", min: 1}
  - id: feedback-seed46-forget
    needs: [feedback-seed46]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k4a/forgetting/feedback-seed46-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"$(ls -d {work}/runs/feedback-seed46-a*/hf-step40 | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/forgetting.json", key: "total_correct", min: 1}
  - id: soft-seed45-forget
    needs: [soft-seed45]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k4a/forgetting/soft-seed45-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"$(ls -d {work}/runs/soft-seed45-a*/hf-step40 | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/forgetting.json", key: "total_correct", min: 1}
  - id: soft-seed46-forget
    needs: [soft-seed46]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k4a/forgetting/soft-seed46-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"$(ls -d {work}/runs/soft-seed46-a*/hf-step40 | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/forgetting.json", key: "total_correct", min: 1}
  - id: variation-seed45-forget
    needs: [variation-seed45]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k4a/forgetting/variation-seed45-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"$(ls -d {work}/runs/variation-seed45-a*/hf-step40 | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/forgetting.json", key: "total_correct", min: 1}
  - id: variation-seed46-forget
    needs: [variation-seed46]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k4a/forgetting/variation-seed46-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"$(ls -d {work}/runs/variation-seed46-a*/hf-step40 | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/forgetting.json", key: "total_correct", min: 1}

  # ---- The readout: K4a's own report tool over the whole of $WORK/runs, so all five
  # seeds of every arm appear in one table, each beside the K0 run with its seed where
  # there is one. Written beside K4a's report-a1, never over it.
  - id: report
    needs: [feedback-seed45, feedback-seed46, soft-seed45, soft-seed46, variation-seed45, variation-seed46, feedback-seed45-forget, feedback-seed46-forget, soft-seed45-forget, soft-seed46-forget, variation-seed45-forget, variation-seed46-forget]
    env: {OUT: "{work}/k4a/report-5seeds-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/k4a_report.py\" --runs \"{work}/runs\" --forgetting \"{work}/k4a/forgetting\" --k0 \"$K0_REPORT\" --out \"{env.OUT}\""]
    bars:
      - {name: "arms-reported", source: "{env.OUT}/k4a-report.json", key: "arms_reported", min: 3}
      - {name: "control-found", source: "{env.OUT}/k4a-report.json", key: "control_runs", min: 3}
      - {name: "one-machine", source: "{env.OUT}/k4a-report.json", key: "comparable", min: 1}

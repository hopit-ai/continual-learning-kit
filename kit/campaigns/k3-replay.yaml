    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k3/eval/b-kl-seed2-gsm8k-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed gsm8k --root \"$GSM8K_ROOT\" --model \"$(ls -d {work}/runs/b-kl-seed2-a*/hf-step40 | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/bed-score.json", key: "n", min: 300}
  - id: b-kl-seed2-forget
    needs: [b-kl-seed2]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k3/forgetting/b-kl-seed2-a{attempt}"}

    bars:
      - {name: "scored", source: "{work}/k1c/cap8192/eval/base17b-gsm8k-a{attempt}/bed-score.json", key: "n", min: 300}
      - {name: "long-cap", source: "{work}/k1c/cap8192/eval/base17b-gsm8k-a{attempt}/bed-score.json", key: "max_new_tokens", min: 8192}
  - id: base17b-finqa-8k
    needs: [pilot-cap]
    wants: [base17b-gsm8k-8k]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k1c/cap8192/eval/base17b-finqa-a{attempt}"}

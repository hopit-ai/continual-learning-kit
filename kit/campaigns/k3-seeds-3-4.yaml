  # ---- The readout: K3's own report tool over the whole tree, all 5 seeds at once.
  # It reads every scoring under $WORK/k3, so it reports seeds 0, 1 and 2 beside 3 and 4;
  # `seeds-reported` is the bar that says so. It is written beside K3's report-a1, never
  # over it: nothing this kit writes is ever overwritten.
  - id: report
    needs: [a-seed3-spider, a-seed3-gsm8k, a-seed4-spider, a-seed4-gsm8k, b-none-seed3-spider, b-none-seed3-gsm8k, b-none-seed3-forget, b-none-seed4-spider, b-none-seed4-gsm8k, b-none-seed4-forget, b-rehearse10-seed3-spider, b-rehearse10-seed3-gsm8k, b-rehearse10-seed3-forget, b-rehearse10-seed4-spider, b-rehearse10-seed4-gsm8k, b-rehearse10-seed4-forget, b-rehearse30-seed3-spider, b-rehearse30-seed3-gsm8k, b-rehearse30-seed3-forget, b-rehearse30-seed4-spider, b-rehearse30-seed4-gsm8k, b-rehearse30-seed4-forget, b-kl-seed3-spider, b-kl-seed3-gsm8k, b-kl-seed3-forget, b-kl-seed4-spider, b-kl-seed4-gsm8k, b-kl-seed4-forget]
    env: {OUT: "{work}/k3/report-5seeds-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/k3_report.py\" --root \"{work}/k3\" --out \"{env.OUT}\""]
    bars:
      - {name: "arms-reported", source: "{env.OUT}/k3-report.json", key: "arms_reported", min: 4}
      - {name: "seeds-reported", source: "{env.OUT}/k3-report.json", key: "seeds_reported", min: 5}
      - {name: "one-machine", source: "{env.OUT}/k3-report.json", key: "comparable", min: 1}

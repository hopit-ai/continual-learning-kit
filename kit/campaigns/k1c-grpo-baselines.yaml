# GENERATED by scripts/make_k1c_campaign.py: do not edit.
#
# Package K1c: the baselines. Every job here is learned ALONE, from the untrained model, with GRPO.
#
# These are the "learned alone" rows every later comparison in this programme needs, and they are
# reward-only RL -- the authors' own `--config-name baseline_grpo`, no teacher, no self-distillation.
# GRPO is also what lets us ask the adapters question at all: receipt 215 found that under SDPO a LoRA
# run silently gives the self-distillation TEACHER its own second, differently random adapter, which is
# a change of method. Under GRPO with use_kl_loss False NO reference model is built, so there is
# nothing for LoRA to corrupt (docs/phase2/k1c/feasibility.md (b)).
#
# PART A, Qwen3-8B on ToolAlpaca -- K0's task, K0's data, K0's geometry, paired seed for seed with the
# partner's finished K0 SDPO runs as a comparator (not a control: GRPO and SDPO are two methods, and
# the point is to see them side by side on the paper's own task).
#
#   full   GRPO full training, learning rate 1e-5
#   lora   GRPO with LoRA rank 64 on all linear layers, alpha 32, learning rate 1e-4
#
# PART B, Qwen3-1.7B -- the K3 model, GRPO full training, one job each, at K3's stage-B dose of 40
# steps x 32 questions.
#
#   gsm8k  grade-school maths learned alone
#   finqa  annual-report arithmetic learned alone
#
# SQL ALONE IS NOT RERUN. K3's stage A (rows a-seed0/1/2) already IS SQL learned alone at 1.7B, and
# kit/k1c_report.py names those rows rather than paying for them twice: pass --k3 with your finished K3
# report and they appear in the table. CODING IS OUT OF SCOPE: the kit has no Modal-free code sandbox,
# so there is no bed to learn a coding task alone on.
#
# THE PILOTS GATE EVERYTHING BELOW THEM, and a failed pilot stops the campaign -- the runner requires
# every earlier pilot before every later row, and `run --all` stops at the first refusal. That is the
# design, not a failure of the harness. Part A's pilots come first and Part B's after Part A's grid, so
# a Part B pilot failure does not cost Part A's twelve GPU-hours.
#
# EVERY BAR HERE IS DETERMINISTIC GIVEN A CLEAN RUN: an exit code, a merged model on disk, a response
# length floor, the untrained validation inside a band written from our own five K0 readings, and -- on
# the LoRA rows -- that the adapter actually reached the weights. Nothing is gated on a quantity that
# two steps cannot measure; those are printed by kit/k1c_report.py instead.
#
# Forgetting is scored exactly as in K1a: on GPU 0 of ONE machine, in the deterministic mode, with the
# untrained model scored twice first (cross-machine scoring drifts by up to 3 points a panel, the size
# of the floor being checked: receipt 204).
#
#   export KIT=/work/continual-learning-kit/kit WORK=/work/k1c-work
#   export SDPO_DIR=/work/SDPO MODEL_DIR=/work/models/Qwen3-8B NGPU=8
#   export GSM8K_ROOT=/work/gsm8k FINQA_ROOT=/work/FinQA/dataset
#   export K0_REPORT=/work/k0-report/report.json        # the SDPO comparator: your finished K0 report
#   export K3_REPORT=/work/k3/report-a1/k3-report.json  # OPTIONAL: adds K3's SQL-alone rows
#   python $KIT/runner.py plan    $KIT/campaigns/k1c-grpo-baselines.yaml
#   python $KIT/runner.py prepare $KIT/campaigns/k1c-grpo-baselines.yaml --all   # no GPU: data, checks
#   python $KIT/runner.py run     $KIT/campaigns/k1c-grpo-baselines.yaml --all   # 8 GPUs; GPU 0 for scoring
schema: kit-campaign.v1
name: k1c-grpo-baselines
workdir_env: WORK
rows:
  # ---- THE MACHINE CHECK, and the untrained Qwen3-8B floor. One GPU, 25 minutes for the
  # three rows below. If one machine cannot score one model the same way twice, no
  # difference this campaign measures means anything (receipt 209). These need no
  # training and are first on purpose: they are the cheapest way to stop the package.
  # ours is 251 of 300; two other machines gave 250 and 251. Far outside this band means the setup differs, not that the model does.
  - id: base8b-1
    pilot: true
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k1c/forgetting/base8b-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"$MODEL_DIR\" --out \"{env.OUT}\""]
    bars:
      - {name: "untrained-total", source: "{env.OUT}/forgetting.json", key: "total_correct", min: 245, max: 257}
  - id: base8b-2
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k1c/forgetting/base8b-repeat-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" generate --model \"$MODEL_DIR\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/forgetting.json", key: "total_correct", min: 1}
  - id: repeatable
    pilot: true
    needs: [base8b-1, base8b-2]
    env: {OUT: "{work}/k1c/repeatable-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/score_forgetting.py\" agree --a \"$(ls -d {work}/k1c/forgetting/base8b-a* | sort -V | tail -1)\" --b \"$(ls -d {work}/k1c/forgetting/base8b-repeat-a* | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:
      - {name: "identical-answers", source: "{env.OUT}/agreement.json", key: "identical_answers", min: 295}
      - {name: "changed-verdicts", source: "{env.OUT}/agreement.json", key: "changed_verdicts", max: 0}
      - {name: "same-machine", source: "{env.OUT}/agreement.json", key: "same_machine_flag", min: 1}

  # ---- PART A PILOTS. Two steps of each arm, about 20 minutes each on 8 x H100. The
  # first one carries every Part A preparation step, so all of this package's Part A IO
  # happens on a CPU before a GPU is ever held.
  # full: GRPO full training: every weight is updated, learning rate 1e-5 as K0's
  - id: pilot-full
    pilot: true
    prepare:
      - ["bash", "-c", "cd \"$SDPO_DIR\" && test -f datasets/tooluse/train.parquet -a -f datasets/tooluse/test.parquet || PYTHONPATH=\"$SDPO_DIR\" python data/preprocess.py --data_source datasets/tooluse"]
      - ["bash", "-c", "test -f \"$MODEL_DIR/config.json\" && ls \"$MODEL_DIR\"/*.safetensors > /dev/null"]
      - ["bash", "-c", "test -f \"$K0_REPORT\" || { echo \"set K0_REPORT to your finished K0 report.json\" >&2; exit 2; }"]
      - ["bash", "-c", "python -c 'import torch, peft, transformers, safetensors; print(\"fold deps:\", torch.__version__, peft.__version__, transformers.__version__)'"]
      - ["bash", "-c", "python \"{kit}/fold_lora.py\" --help > /dev/null"]
    requires: ["{kit}/fold_lora.py", "{kit}/run_grpo_toolalpaca.sh"]
    env: {NAME: "pilot-full-a{attempt}", STEPS: "2", TEST_FREQ: "2"}
    command: ["bash", "{kit}/run_grpo_toolalpaca.sh"]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/run-summary.json", key: "returncode", max: 0}
      - {name: "merged-model-present", source: "{work}/runs/{env.NAME}/run-summary.json", key: "merged", min: 1}
      - {name: "no-length-collapse", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "response_length/mean", agg: "min", min: 16}
      - {name: "arm-is-full", source: "{work}/runs/{env.NAME}/run-summary.json", key: "lora", max: 0}
      - {name: "untrained-validation", source: "{work}/runs/{env.NAME}/metrics.jsonl", key: "val-core/tooluse/acc/mean@16", where: {"step": 0}, agg: "first", min: 0.555, max: 0.6}
  # lora: GRPO with LoRA rank 64 on all linear layers, alpha 32 and learning rate 1e-4 (10x full, per 'LoRA Without Regret', Schulman et al., Thinking Machines 2025)
  # the merger saves the BASE model and an adapter with lora_alpha 0 hard-coded (base_model_merger.py:268,301-306), so the launcher folds it with kit/fold_lora.py and hf-step40 is the folded model. `adapter-folded` and `weights-really-changed` are bars because a silent no-op would report 'LoRA forgets nothing' having scored the untrained model: docs/phase2/k1c/feasibility.md (b)
  - id: pilot-lora
    pilot: true
    env: {NAME: "pilot-lora-a{attempt}", STEPS: "2", TEST_FREQ: "2", LORA: "1"}
    command: ["bash", "{kit}/run_grpo_toolalpaca.sh"]
    bars:

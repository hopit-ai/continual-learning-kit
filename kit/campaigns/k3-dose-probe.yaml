# Package K3 stage-A dose probe: which change to the dose makes the model learn SQL?
#
# K3's pilot gate FAILED by design. The untrained Qwen3-1.7B scores 70 of 100 on the Spider held-out
# set; after stage A -- 20 GRPO steps over the 640 frozen Spider training questions, one pass, lr 1e-5
# with 10 warm-up steps, batch 32 x 8 samples -- it scored 62, and the bar was +5. Paired: 21 right ->
# wrong, 13 wrong -> right, 66 unchanged, exact McNemar p = 0.229. The training reward was flat around
# 0.63 with no trend and one answer was truncated at 2,048 tokens. The stuck-set measurement
# (docs/phase2/evidence/k4-gate, receipt 227) says that on those same 640 questions this model solves
# 300 EVERY time and 171 NEVER, at 8 attempts and temperature 1.0 -- so about 170 questions carry any
# gradient at all, and half the 20 steps are warm-up. The reading is "the dose is too small", not
# "training damaged the model", and this probe is how that reading is tested before K3 is restarted.
#
# FOUR ARMS, each ONE change to stage A, all at seed 0 from the untrained model:
#
#   ref20     the reference dose, rerun on this machine. It measures the run-to-run noise of the
#             pipeline itself, which every other arm's gap has to be read against
#   steps60   three passes over the same 640 questions: 60 steps. kit/run_grpo.sh passes
#             data.shuffle=False and trainer.total_epochs=1, so a run can take only as many steps as
#             its file has batches -- "more steps" IS a longer file, built by kit/sequence.py pool
#   lr3x      the reference dose at three times the learning rate (LR=3e-5), same 20 steps
#   hard20    20 steps over the questions the model does NOT already solve every time: kit/subset.py
#             drops those, kit/sequence.py pool takes the rest back up to 640 rows, so this arm is the
#             same 20 steps over about two passes of the questions that carry gradient
#
# The warm-up stays at kit/run_grpo.sh's 10 steps on every arm. That is deliberate: it is part of what
# `steps60` changes the meaning of (10 of 60 rather than 10 of 20) and part of what the probe reports.
#
# THIS PROBE HAS NO GATE. No row is a pilot. The four `*-delta` rows are READOUTS -- they put the
# arm's improvement in a file with a bar on it so the runner prints a verdict -- and nothing needs
# them, so an arm that does not clear +5 stops no other arm and does not stop the report. They come
# last for that reason: `run --all` stops at the first failure, so run any remaining delta row with
# `--row <id>` after one of them fails. The report needs only the five scorings.
#
# WORK MAY BE THE PARTNER'S K3 WORK TREE. The model and the Spider bed live at the same paths K3 uses
# ({work}/data/spider, {work}/models/Qwen3-1.7B), so a machine that already ran K3's prepare re-uses
# them and downloads nothing. Everything this probe writes is under {work}/k3dose/ and {work}/runs/.
#
# All scoring is on GPU 0 of this machine, in the deterministic mode, and only scorings carrying the
# same machine-and-mode fingerprint are ever compared (receipts 204 and 209).
#
#   export KIT=/work/continual-learning-kit/kit WORK=/work/k3-work
#   export SDPO_DIR=/work/SDPO SPIDER_ROOT=/work/spider_data
#   python $KIT/runner.py plan    $KIT/campaigns/k3-dose-probe.yaml
#   python $KIT/runner.py prepare $KIT/campaigns/k3-dose-probe.yaml --all   # no GPU: download, bed files
#   python $KIT/runner.py run     $KIT/campaigns/k3-dose-probe.yaml --all   # 8 GPUs; GPU 0 for scoring
schema: kit-campaign.v1
name: k3-dose-probe
workdir_env: WORK
rows:
  # ---- The untrained model on the Spider held-out set: the floor every arm is read against, and
  # the source of the per-item verdicts the report follows question by question. The FIRST row
  # carries the preparation of the whole probe, so all of its IO happens before a GPU is held.
  - id: base-spider
    prepare:
      - ["bash", "-c", "test -f \"{work}/models/Qwen3-1.7B/config.json\" || hf download Qwen/Qwen3-1.7B --local-dir \"{work}/models/Qwen3-1.7B\" || huggingface-cli download Qwen/Qwen3-1.7B --local-dir \"{work}/models/Qwen3-1.7B\""]
      - ["bash", "-c", "test -f \"{work}/data/spider/train.parquet\" || python \"{kit}/beds/spider.py\" prepare --spider-root \"$SPIDER_ROOT\" --out \"{work}/data/spider\""]
    requires: ["{work}/models/Qwen3-1.7B/config.json", "{work}/data/spider/train.parquet", "{work}/data/spider/heldout.parquet"]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k3dose/eval/base-spider-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed spider --root \"$SPIDER_ROOT\" --model \"{work}/models/Qwen3-1.7B\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/bed-score.json", key: "n", min: 100, max: 100}

  # ---- Which of the 640 training questions carry a gradient. 8 attempts a question at temperature
  # 1.0 -- the trainer's own sampling, and the one the gate measured with. ONE GPU, under two minutes.
  # The second bar is what `hard20` needs to exist at all: if fewer than 32 questions are ever missed,
  # there is no subset to train on.
  - id: stuck
    needs: [base-spider]
    requires: ["{work}/data/spider/train.jsonl", "{work}/models/Qwen3-1.7B/config.json"]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k3dose/stuck/spider-stuck-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/hints.py\" stuck --rows \"{work}/data/spider/train.jsonl\" --model \"{work}/models/Qwen3-1.7B\" --attempts 8 --temperature 1.0 --out \"{env.OUT}\""]
    bars:
      - {name: "every-question-sampled", source: "{env.OUT}/stuck.json", key: "questions", min: 640, max: 640}
      - {name: "a-subset-is-left", source: "{env.OUT}/stuck.json", key: "solved_every_time", max: 608}

  # ---- `hard20`'s training file: drop the always-solved questions, then pool what is left back up
  # to 640 rows (20 steps x 32) at seed 0, which is about two passes over them. Both tools refuse to
  # overwrite, both write a manifest, and neither touches a prompt, an answer or a checker.
  - id: subset
    needs: [stuck]
    requires: ["{work}/data/spider/train.parquet"]
    env: {OUT: "{work}/k3dose/data/hard-subset-a{attempt}", POOL: "{work}/k3dose/data/hard640-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/subset.py\" drop-solved --from \"{work}/data/spider/train.parquet\" --stuck \"$(ls -d {work}/k3dose/stuck/spider-stuck-a* | sort -V | tail -1)/stuck.json\" --out \"{env.OUT}\" && python \"{kit}/sequence.py\" pool --from \"{env.OUT}/train.parquet\" --rows 640 --seed 0 --out \"{env.POOL}\""]
    bars:
      - {name: "questions-kept", source: "{env.OUT}/subset.manifest.json", key: "kept", min: 32}
      - {name: "pooled-to-the-dose", source: "{env.POOL}/pool.manifest.json", key: "rows_total", min: 640, max: 640}

  # ---- `steps60`'s training file: three passes over the same 640 questions, written as 1,920 rows,
  # because the trainer reads its file once and in order.
  - id: pool1920
    requires: ["{work}/data/spider/train.parquet"]
    env: {OUT: "{work}/k3dose/data/spider1920-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/sequence.py\" pool --from \"{work}/data/spider/train.parquet\" --rows 1920 --seed 0 --out \"{env.OUT}\""]
    bars:
      - {name: "pooled-to-the-dose", source: "{env.OUT}/pool.manifest.json", key: "rows_total", min: 1920, max: 1920}

  # ---- ARM 1, ref20: K3's stage A exactly, rerun here. Its gap from zero is this pipeline's own
  # run-to-run noise, and no other arm means anything without it.
  - id: ref20
    description: "the reference dose, rerun on this machine (the pipeline's own run-to-run noise)"
    needs: [base-spider]
    requires: ["{work}/data/spider/train.parquet", "{work}/data/spider/heldout.parquet", "{work}/models/Qwen3-1.7B/config.json"]
    env: {NAME: "ref20-seed0-a{attempt}", WORK: "{work}", VAL_FILE: "{work}/data/spider/heldout.parquet", STEPS: "20", SAVE_FREQ: "20", LR: "1e-5", SEED: "0", NGPU: "8", KL: "0", FILE_LOG: "1"}
    command: ["bash", "-c", "TRAIN_FILE=\"{work}/data/spider/train.parquet\" MODEL_DIR=\"{work}/models/Qwen3-1.7B\" bash \"{kit}/run_grpo.sh\""]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/train-summary.json", key: "returncode", max: 0}
      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-run", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 20}
  - id: ref20-spider
    needs: [ref20]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k3dose/eval/ref20-spider-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed spider --root \"$SPIDER_ROOT\" --model \"$(ls -d {work}/runs/ref20-seed0-a*/hf-step20 | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/bed-score.json", key: "n", min: 100, max: 100}

  # ---- ARM 2, steps60: the same questions three times over, at the reference learning rate.
  - id: steps60
    description: "three passes over the same 640 questions: 60 steps instead of 20"
    needs: [base-spider, pool1920]
    requires: ["{work}/data/spider/heldout.parquet", "{work}/models/Qwen3-1.7B/config.json"]
    env: {NAME: "steps60-seed0-a{attempt}", WORK: "{work}", VAL_FILE: "{work}/data/spider/heldout.parquet", STEPS: "60", SAVE_FREQ: "60", LR: "1e-5", SEED: "0", NGPU: "8", KL: "0", FILE_LOG: "1"}
    command: ["bash", "-c", "TRAIN_FILE=\"$(ls -d {work}/k3dose/data/spider1920-a* | sort -V | tail -1)/train.parquet\" MODEL_DIR=\"{work}/models/Qwen3-1.7B\" bash \"{kit}/run_grpo.sh\""]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/train-summary.json", key: "returncode", max: 0}
      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-run", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 60}
  - id: steps60-spider
    needs: [steps60]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k3dose/eval/steps60-spider-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed spider --root \"$SPIDER_ROOT\" --model \"$(ls -d {work}/runs/steps60-seed0-a*/hf-step60 | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/bed-score.json", key: "n", min: 100, max: 100}

  # ---- ARM 3, lr3x: the reference dose, three times the learning rate. Warm-up is still 10 of 20.
  - id: lr3x
    description: "the reference dose at three times the learning rate"
    needs: [base-spider]
    requires: ["{work}/data/spider/train.parquet", "{work}/data/spider/heldout.parquet", "{work}/models/Qwen3-1.7B/config.json"]
    env: {NAME: "lr3x-seed0-a{attempt}", WORK: "{work}", VAL_FILE: "{work}/data/spider/heldout.parquet", STEPS: "20", SAVE_FREQ: "20", LR: "3e-5", SEED: "0", NGPU: "8", KL: "0", FILE_LOG: "1"}
    command: ["bash", "-c", "TRAIN_FILE=\"{work}/data/spider/train.parquet\" MODEL_DIR=\"{work}/models/Qwen3-1.7B\" bash \"{kit}/run_grpo.sh\""]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/train-summary.json", key: "returncode", max: 0}
      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-run", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 20}
  - id: lr3x-spider
    needs: [lr3x]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k3dose/eval/lr3x-spider-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed spider --root \"$SPIDER_ROOT\" --model \"$(ls -d {work}/runs/lr3x-seed0-a*/hf-step20 | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/bed-score.json", key: "n", min: 100, max: 100}

  # ---- ARM 4, hard20: the reference dose over the questions that carry gradient.
  - id: hard20
    description: "20 steps over the questions the untrained model does NOT already solve every time"
    needs: [base-spider, subset]
    requires: ["{work}/data/spider/heldout.parquet", "{work}/models/Qwen3-1.7B/config.json"]
    env: {NAME: "hard20-seed0-a{attempt}", WORK: "{work}", VAL_FILE: "{work}/data/spider/heldout.parquet", STEPS: "20", SAVE_FREQ: "20", LR: "1e-5", SEED: "0", NGPU: "8", KL: "0", FILE_LOG: "1"}
    command: ["bash", "-c", "TRAIN_FILE=\"$(ls -d {work}/k3dose/data/hard640-a* | sort -V | tail -1)/train.parquet\" MODEL_DIR=\"{work}/models/Qwen3-1.7B\" bash \"{kit}/run_grpo.sh\""]
    bars:
      - {name: "trainer-exited-clean", source: "{work}/runs/{env.NAME}/train-summary.json", key: "returncode", max: 0}
      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-run", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 20}
  - id: hard20-spider
    needs: [hard20]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k3dose/eval/hard20-spider-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed spider --root \"$SPIDER_ROOT\" --model \"$(ls -d {work}/runs/hard20-seed0-a*/hf-step20 | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/bed-score.json", key: "n", min: 100, max: 100}

  # ---- The readout: the four arms side by side, with the paired churn, the exact McNemar p, what
  # the trainer logged per step and what a correct answer costs. It needs the five scorings and
  # nothing else, so a delta row below cannot keep it from being written.
  - id: report
    needs: [base-spider, ref20-spider, steps60-spider, lr3x-spider, hard20-spider]
    env: {OUT: "{work}/k3dose/report/a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/k3_dose_report.py\" --root \"{work}/k3dose\" --runs \"{work}/runs\" --out \"{env.OUT}\""]
    bars:
      - {name: "arms-reported", source: "{env.OUT}/report.json", key: "arms_reported", min: 4}

  # ---- THE READOUTS, and nothing needs them. Each puts one arm's improvement over the untrained
  # model in a file so the runner prints a verdict against K3's own +5 bar and against the
  # same-machine rule. A FAILED BAR HERE IS AN ANSWER, not a broken probe: it says that arm's change
  # to the dose did not make the model learn SQL. `run --all` still stops at the first failure, so
  # run the remaining delta rows with `--row <id>`.
  - id: ref20-delta
    needs: [base-spider, ref20-spider]
    env: {OUT: "{work}/k3dose/deltas/ref20-a{attempt}.json"}
    command: ["bash", "-c", "python \"{kit}/delta.py\" --a \"$(ls -d {work}/k3dose/eval/base-spider-a* | sort -V | tail -1)\" --b \"$(ls -d {work}/k3dose/eval/ref20-spider-a* | sort -V | tail -1)\" --key correct --out \"{env.OUT}\""]
    bars:
      - {name: "delta-recorded", source: "{env.OUT}", key: "delta", min: -100}   # the +5 verdict is the report's; a failing arm must not halt `run --all`
      - {name: "same-machine", source: "{env.OUT}", key: "same_machine_flag", min: 1}
  - id: steps60-delta
    needs: [base-spider, steps60-spider]
    env: {OUT: "{work}/k3dose/deltas/steps60-a{attempt}.json"}
    command: ["bash", "-c", "python \"{kit}/delta.py\" --a \"$(ls -d {work}/k3dose/eval/base-spider-a* | sort -V | tail -1)\" --b \"$(ls -d {work}/k3dose/eval/steps60-spider-a* | sort -V | tail -1)\" --key correct --out \"{env.OUT}\""]
    bars:
      - {name: "delta-recorded", source: "{env.OUT}", key: "delta", min: -100}   # the +5 verdict is the report's; a failing arm must not halt `run --all`
      - {name: "same-machine", source: "{env.OUT}", key: "same_machine_flag", min: 1}
  - id: lr3x-delta
    needs: [base-spider, lr3x-spider]
    env: {OUT: "{work}/k3dose/deltas/lr3x-a{attempt}.json"}
    command: ["bash", "-c", "python \"{kit}/delta.py\" --a \"$(ls -d {work}/k3dose/eval/base-spider-a* | sort -V | tail -1)\" --b \"$(ls -d {work}/k3dose/eval/lr3x-spider-a* | sort -V | tail -1)\" --key correct --out \"{env.OUT}\""]
    bars:
      - {name: "delta-recorded", source: "{env.OUT}", key: "delta", min: -100}   # the +5 verdict is the report's; a failing arm must not halt `run --all`
      - {name: "same-machine", source: "{env.OUT}", key: "same_machine_flag", min: 1}
  - id: hard20-delta
    needs: [base-spider, hard20-spider]
    env: {OUT: "{work}/k3dose/deltas/hard20-a{attempt}.json"}
    command: ["bash", "-c", "python \"{kit}/delta.py\" --a \"$(ls -d {work}/k3dose/eval/base-spider-a* | sort -V | tail -1)\" --b \"$(ls -d {work}/k3dose/eval/hard20-spider-a* | sort -V | tail -1)\" --key correct --out \"{env.OUT}\""]
    bars:
      - {name: "delta-recorded", source: "{env.OUT}", key: "delta", min: -100}   # the +5 verdict is the report's; a failing arm must not halt `run --all`
      - {name: "same-machine", source: "{env.OUT}", key: "same_machine_flag", min: 1}

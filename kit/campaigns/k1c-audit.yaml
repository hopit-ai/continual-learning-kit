# GENERATED by scripts/make_k1c_audit_campaign.py: do not edit.
#
# Plan v3, package 1: the budget audit of the ten K1c Part B checkpoints. Trains nothing.
#
# K1c scored every model at 2,048 new tokens; the trainer had allowed 8,192, and in eight of the ten runs the answers
# had grown past the scoring cap. An answer cut at the cap is scored as it stands, so that count cannot separate an
# answer that was wrong from one that did not end. Here each checkpoint (and the untrained model) is generated ONCE
# at 8,192 new tokens with its token ids kept, and the score at every shorter budget is read from prefixes of that
# one generation (kit/cap_sweep.py). Each answer is read two ways: by the bed's own strict rule, and by a gold-blind
# rule that takes the last answer the model had stated (kit/canonical.py). kit/budget_report.py then writes the
# signed accounting of each checkpoint's loss: change in budget sensitivity, change in extraction sensitivity,
# and what remains at the long cap. It is bookkeeping, not a split into causes.
#
# WHAT IT CAN AND CANNOT SHOW. These ten runs did not clearly learn anything, so this measures damage to abilities
# the untrained model already had. The 2,048 scoring stays the bar of record: a model that needs several times the
# tokens to finish has failed the cost bar whatever it scores at 8,192.
#
# ONE PHYSICAL GPU. Every scoring row carries CUDA_VISIBLE_DEVICES "0" and follows the one before it (`wants`),
# because the reports refuse scorings whose machine fingerprints differ and the fingerprint includes the visible GPU.
# If your dispatcher assigns GPUs itself, pin this campaign to one GPU. The sweep and report rows use no GPU.
#
# THE PREFIX CHECK. Two checkpoints are also scored directly at 2,048 in the same 12,288-token context
# (`direct-*`), and `check-same-gpu-*` compares each direct answer with the first 2,048 tokens of the long one. The
# `check-k1c-*` rows make the same comparison against the 2,048 scorings K1c already left on disk, for all twelve.
# A low agreement is a recorded fact with a bar on it, and nothing later waits for it.
#
# NEEDS: the finished K1c tree in the same $WORK (runs/*/hf-step40 for the ten Part B runs, models/Qwen3-1.7B, and
# k1c/eval/*). About 4 to 8 hours on the one GPU.
#
#   export KIT=/work/continual-learning-kit/kit WORK=/work/k1c-work
#   export GSM8K_ROOT=/work/gsm8k FINQA_ROOT=/work/FinQA/dataset K0_REPORT=/work/k0-report/report.json
#   python $KIT/runner.py batch $KIT/campaigns/k1c-audit.yaml
schema: kit-campaign.v1
name: k1c-audit

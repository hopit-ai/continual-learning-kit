      - {name: "checkpoint-merged", source: "{work}/runs/{env.NAME}/train-summary.json", key: "merged", min: 1}
      - {name: "steps-run", source: "{work}/runs/{env.NAME}/train-summary.json", key: "steps", min: 20}
      - {name: "kl-applied", source: "{work}/runs/{env.NAME}/train-summary.json", key: "kl", min: 1, max: 1}
  - id: kl10-r2-spider
    seed: 2
    needs: [kl10-r2]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k3anchor/eval/kl10-r2-spider-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed spider --root \"$SPIDER_ROOT\" --model \"$(ls -d {work}/runs/anchor-kl10-r2-seed2-a*/hf-step20 | sort -V | tail -1)\" --out \"{env.OUT}\""]
    bars:

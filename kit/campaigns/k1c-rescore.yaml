# K1c rescoring at the trainer's own answer cap. Hand-written; one purpose.
#
# K1c Part B scored every trained 1.7B at the kit's 2,048-new-token cap, the same cap the untrained
# model and every panel use. The archive showed that in eight of the ten runs the answers had grown
# during training (the trainer allows 8,192) and were cut at that cap when scored: on those runs the
# answers cut and wrong are at least nine tenths of the "wrong format" count (receipt 241, corrected
# in receipt 242). A cut answer is scored as it stood, so the 2,048 count cannot separate an answer
# that was wrong from one that did not end. This campaign scores the SAME ten Part B checkpoints and
# the untrained model again at 8,192 new tokens, bed and panel, and writes a second K1c report from
# those scorings.
#
# WHAT IT IS NOT. The bar of record stays the 2,048-token scoring (K1c's report-a1): a model that needs
# several times the tokens to finish has still failed the cost bar (1.5x tokens per correct answer).
# This is a diagnosis, and how it will be read is written down before it runs
# (docs/phase2/k3-rebuild-preregistration-20260929.md, amendment 3, in the private repository).
#
# ONE PHYSICAL GPU. Every row carries CUDA_VISIBLE_DEVICES "0" and rows are ordered one after another
# (`wants`), because the report refuses scorings whose machine fingerprints differ and the fingerprint
# includes the visible GPU. If your dispatcher assigns GPUs itself, pin this campaign to one GPU.
#
# THE PILOT is eight GSM8K questions at the long cap on the untrained model, about two minutes. It is
# the first time `--max-new-tokens` meets a real engine; if it fails, nothing else runs.
#
# NEEDS: the finished K1c tree in the same $WORK (runs/*/hf-step40 for the ten Part B runs and
# models/Qwen3-1.7B). Nothing here trains. About 3 to 6 hours on the one GPU.
#
#   export KIT=/work/continual-learning-kit/kit WORK=/work/k1c-work
#   export GSM8K_ROOT=/work/gsm8k FINQA_ROOT=/work/FinQA/dataset K0_REPORT=/work/k0-report/report.json
#   python $KIT/runner.py batch $KIT/campaigns/k1c-rescore.yaml
schema: kit-campaign.v1
name: k1c-rescore
workdir_env: WORK
rows:
  # ---- the pilot: the long cap on a real engine, eight questions
  - id: pilot-cap
    pilot: true
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k1c/cap8192/pilot-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed gsm8k --root \"$GSM8K_ROOT\" --model \"{work}/models/Qwen3-1.7B\" --max-new-tokens 8192 --limit 8 --out \"{work}/k1c/cap8192/pilot-a{attempt}\""]
    bars:
      - {name: "scored", source: "{work}/k1c/cap8192/pilot-a{attempt}/bed-score.json", key: "n", min: 8}
      - {name: "long-cap", source: "{work}/k1c/cap8192/pilot-a{attempt}/bed-score.json", key: "max_new_tokens", min: 8192}
  # ---- the untrained model at the long cap: the row every trained one is read against
  - id: base17b-gsm8k-8k
    needs: [pilot-cap]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k1c/cap8192/eval/base17b-gsm8k-a{attempt}"}

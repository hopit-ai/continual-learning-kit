      - {name: "changed-verdicts", source: "{env.OUT}/agreement.json", key: "changed_verdicts", max: 0}
      - {name: "same-machine", source: "{env.OUT}/agreement.json", key: "same_machine_flag", min: 1}

  # Stage 0 of every sequence: the untrained model on all four beds, and the plasticity
  # probe every later probe takes its saturation threshold from. Its panels are `base`,

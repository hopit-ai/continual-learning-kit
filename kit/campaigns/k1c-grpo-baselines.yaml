  # ---- PART B's FLOOR: the untrained Qwen3-1.7B on both jobs and on the panels. The
  # machine was already shown to score one model twice the same way, above, on the 8B, so
  # this is scored once. There is no band bar here: we have no measurement of our own for
  # the untrained 1.7B on either bed, and a band we invented would gate on a guess.
  # The FIRST row here carries every Part B preparation step -- the 1.7B download and both
  # beds -- and every Part B row names the files it needs, so no GPU waits on IO.
  - id: base17b-finqa
    prepare:
      - ["bash", "-c", "test -f \"{work}/models/Qwen3-1.7B/config.json\" || hf download Qwen/Qwen3-1.7B --local-dir \"{work}/models/Qwen3-1.7B\" || huggingface-cli download Qwen/Qwen3-1.7B --local-dir \"{work}/models/Qwen3-1.7B\""]
      - ["bash", "-c", "test -f \"{work}/data/gsm8k-1280/train.parquet\" || python \"{kit}/beds/gsm8k.py\" prepare --gsm8k-root \"$GSM8K_ROOT\" --out \"{work}/data/gsm8k-1280\" --limit 1280"]
      - ["bash", "-c", "test -f \"{work}/data/finqa-1600/train.parquet\" || python \"{kit}/beds/finqa.py\" prepare --finqa-root \"$FINQA_ROOT\" --out \"{work}/data/finqa-1600\" --limit 1600"]
      - ["bash", "-c", "rows=$(wc -l < \"{work}/data/gsm8k-1280/train.jsonl\"); echo \"gsm8k train rows: $rows (need 1280)\"; test \"$rows\" -ge 1280 || { echo \"the GSM8K training file is shorter than the dose needs\" >&2; exit 2; }"]
      - ["bash", "-c", "rows=$(wc -l < \"{work}/data/finqa-1600/train.jsonl\"); echo \"finqa train rows: $rows (need 1600, of which at least 1280 must survive verl max_prompt_length=2048)\"; test \"$rows\" -ge 1600 || { echo \"the FinQA training file is shorter than the dose needs\" >&2; exit 2; }"]
    requires: ["{work}/models/Qwen3-1.7B/config.json", "{work}/data/finqa-1600/train.parquet", "{work}/data/finqa-1600/test.parquet"]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k1c/eval/base17b-finqa-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed finqa --root \"$FINQA_ROOT\" --model \"{work}/models/Qwen3-1.7B\" --out \"{env.OUT}\""]
    bars:
      - {name: "scored", source: "{env.OUT}/bed-score.json", key: "n", min: 1147}
  - id: base17b-gsm8k
    requires: ["{work}/models/Qwen3-1.7B/config.json", "{work}/data/gsm8k-1280/train.parquet", "{work}/data/gsm8k-1280/heldout.parquet"]
    env: {CUDA_VISIBLE_DEVICES: "0", OUT: "{work}/k1c/eval/base17b-gsm8k-a{attempt}"}
    command: ["bash", "-c", "python \"{kit}/eval_bed.py\" generate --bed gsm8k --root \"$GSM8K_ROOT\" --model \"{work}/models/Qwen3-1.7B\" --out \"{env.OUT}\""]
